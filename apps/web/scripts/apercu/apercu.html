<!doctype html>
<!--
  Source de public/og-image.png (aperçu des liens partagés, 1200 × 630).
  Régénérer : voir scripts/apercu/README.md. Couleurs et polices = jetons du design system (src/design-system/tokens.css).
-->
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Familjen Grotesk"; font-weight: 700; src: url(../../node_modules/@fontsource/familjen-grotesk/files/familjen-grotesk-latin-700-normal.woff2); }
  @font-face { font-family: "Familjen Grotesk"; font-weight: 600; src: url(../../node_modules/@fontsource/familjen-grotesk/files/familjen-grotesk-latin-600-normal.woff2); }
  @font-face { font-family: "Noto Sans"; font-weight: 400; src: url(../../node_modules/@fontsource/noto-sans/files/noto-sans-latin-400-normal.woff2); }
  :root { --midnight: #02070A; --electric-blue: #0297DE; --cantaloupe: #FC734D; --blanc: #FFFFFF; --muet: #A9BAC4; --trait: #1C2A33; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: var(--midnight); overflow: hidden; }
  body { position: relative; color: var(--blanc); font-family: "Noto Sans", sans-serif; }
  .marque { position: absolute; top: 64px; left: 80px; display: flex; align-items: center; gap: 16px; }
  .marque svg { width: 56px; height: 56px; }
  .marque span { font: 700 34px/1 "Familjen Grotesk", sans-serif; letter-spacing: -0.5px; }
  h1 { position: absolute; top: 172px; left: 80px; width: 820px; font: 700 70px/78px "Familjen Grotesk", sans-serif; letter-spacing: -1.5px; }
  h1 .point { color: var(--cantaloupe); }
  p { position: absolute; top: 352px; left: 80px; width: 720px; font-size: 26px; line-height: 37px; color: var(--muet); }
  .piliers { position: absolute; left: 80px; bottom: 64px; display: flex; gap: 12px; }
  .piliers span { padding: 10px 18px; border: 1.5px solid var(--trait); border-radius: 999px; font: 600 21px/1 "Familjen Grotesk", sans-serif; color: var(--blanc); }
  .piliers span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--electric-blue); margin-right: 10px; vertical-align: 2px; }
  .piliers span:nth-child(2)::before { background: var(--cantaloupe); }
  .piliers span:nth-child(3)::before { background: #7BC86C; }
  .grand { position: absolute; right: -40px; top: 40px; width: 470px; height: 470px; }
  .adresse { position: absolute; right: 80px; bottom: 64px; font: 600 26px/1 "Familjen Grotesk", sans-serif; color: var(--blanc); }
  .adresse::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--cantaloupe); margin-right: 12px; vertical-align: 3px; }
</style>
</head>
<body>
  <div class="marque">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#FFFFFF"/><path d="M37 15v23a10.5 10.5 0 0 1-21 0" fill="none" stroke="#02070A" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="47" r="6.5" fill="#FC734D"/></svg>
    <span>Jamii</span>
  </div>

  <!-- Le J du logo, en grand, comme signature visuelle à droite. -->
  <svg class="grand" viewBox="0 0 64 64" aria-hidden="true"><path d="M37 15v23a10.5 10.5 0 0 1-21 0" fill="none" stroke="#0297DE" stroke-opacity="0.22" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="47" r="6.5" fill="#FC734D"/></svg>

  <h1>Trouve ton équipe.<br />Mets ton projet en ligne<span class="point">.</span></h1>
  <p>La plateforme des développeurs africains : s'entraider, livrer pour des PME, garder ses projets en ligne.</p>

  <div class="piliers"><span>Profils prouvés</span><span>Tech Tontine</span><span>Mise en ligne</span></div>
  <div class="adresse">jamii.dev</div>
</body>
</html>

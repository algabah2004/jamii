# Toute la configuration passe par des variables d'environnement (DataCloud, CI) : voir .env.example.
spring:
  application:
    name: jamii-api
  # Les fichiers joints (module fichiers) : 25 Mo au plus (une courte vidéo) ; chaque sorte a sa propre limite.
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    # sslmode : « prefer » en local (pas de TLS dans docker compose), « require » ou « verify-full » en production.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:jamii}?sslmode=${POSTGRES_SSLMODE:prefer}
    username: ${POSTGRES_USER:jamii}
    # Pas de valeur par défaut : un mot de passe ne vit que dans l'environnement.
    password: ${POSTGRES_PASSWORD}
  jpa:
    # Le schéma appartient à Flyway : Hibernate vérifie, il ne modifie jamais.
    hibernate:
      ddl-auto: validate
    # Pas de requête SQL cachée pendant le rendu de la réponse.
    open-in-view: false
  # Cinq personnes ajoutent des migrations en parallèle, datées à l'heure où elles les écrivent : une PR fusionnée
  # après une autre peut apporter une migration plus ancienne que la dernière appliquée. Sans ceci, Flyway refuse de
  # démarrer (panne du 15/11, 10 h 26 GMT). Les migrations restent indépendantes les unes des autres.
  flyway:
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:true}
  # Le schéma des sessions est créé par Flyway (V2), comme le reste.
  session:
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          github:
            # Valeurs factices par défaut : l'API démarre sans application GitHub (tests, autres blocs).
            # Pour se connecter vraiment, créer une OAuth App GitHub et remplir .env (voir .env.example).
            client-id: ${GITHUB_CLIENT_ID:a-configurer}
            client-secret: ${GITHUB_CLIENT_SECRET:a-configurer}
            # read:user suffit pour le profil. user:email viendra avec le rattachement d'un e-mail vérifié.
            scope: read:user
            redirect-uri: "{baseUrl}/api/auth/{registrationId}/retour"
          # Se connecter avec Google (#260). Sans GOOGLE_CLIENT_ID, le bouton n'apparaît pas et /api/auth/google ne
          # démarre rien. Pas d'« openid » : le profil vient de userinfo (sub, email, email_verified, name, picture).
          google:
            client-id: ${GOOGLE_CLIENT_ID:a-configurer}
            client-secret: ${GOOGLE_CLIENT_SECRET:a-configurer}
            scope: profile, email
            redirect-uri: "{baseUrl}/api/auth/{registrationId}/retour"
  # En local uniquement (./mvnw spring-boot:run) : Spring Boot lance le PostgreSQL de docker-compose.yml
  # et s'y connecte tout seul. docker compose lit lui-même le .env de la racine.
  # Ce module n'est pas embarqué dans le jar de production, ni actif pendant les tests.
  docker:
    compose:
      file: ../../docker-compose.yml
      # La base est partagée avec le service IA : l'arrêt de l'API ne l'arrête pas.
      lifecycle-management: start-only

server:
  # PORT : port imposé par la plateforme d'hébergement, s'il y en a un. API_PORT : choix local.
  port: ${PORT:${API_PORT:8080}}
  # Derrière le proxy HTTPS de l'hébergeur : l'adresse de retour GitHub doit être construite en https://.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 7d
      cookie:
        name: JAMII_SESSION
        http-only: true
        # Toujours true en production (HTTPS). false seulement en local sur http://localhost avec Safari, qui refuse
        # un cookie Secure sans HTTPS (Chrome et Firefox l'acceptent sur localhost) : SESSION_COOKIE_SECURE=false.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

jamii:
  demo:
    # Profil demo seulement : le login GitHub d'un vrai compte à placer dans la démo (son cercle, ses communautés…).
    # Le compte doit s'être connecté une fois. Vide : aucun.
    compte: ${JAMII_DEMO_COMPTE:}
  # Les appels vocaux et vidéo des salons (#155) : un serveur Jitsi. Chaque salon y a sa salle.
  appels:
    url: ${APPELS_URL:https://meet.jit.si}
    # Les appels WebRTC des discussions privées (#157) : un STUN, et notre relais coturn (identifiants temporaires,
    # use-auth-secret). Sans TURN_SECRET, STUN seulement : les appels passent sur la plupart des réseaux, pas tous.
    stun: ${STUN_URLS:stun:stun.l.google.com:19302}
    turn:
      urls: ${TURN_URLS:}
      secret: ${TURN_SECRET:}
  # Adresse du front : on y renvoie l'utilisateur après la connexion.
  web-url: ${WEB_URL:http://localhost:5173}
  email:
    # simule : n'envoie rien (local et tests). brevo : l'API HTTP de Brevo (production).
    fournisseur: ${EMAIL_FOURNISSEUR:simule}
    # Adresse vérifiée chez Brevo, et nom affiché au destinataire.
    expediteur: ${EMAIL_EXPEDITEUR:}
    nom-expediteur: ${EMAIL_NOM_EXPEDITEUR:Jamii}
    brevo:
      cle: ${BREVO_API_KEY:}
    # Local seulement : affiche le lien de connexion dans la console. Jamais en production (le lien est un mot de passe).
    afficher-lien: ${EMAIL_AFFICHER_LIEN:false}
  # Ce que Systalink reçoit de Jamii (contracts/systalink.yaml v0.2).
  clients-systalink:
    # Logins GitHub ou e-mails, séparés par des virgules, qui ont accès aux clients suivis (en plus des admins).
    acces: ${SYSTALINK_ACCES:}
    # Code donné au jury de la CADEV avec la soumission (8 caractères au moins). Vide : pas d'accès par code.
    code-jury: ${SYSTALINK_CODE_JURY:}
    # Webhook signé vers l'outil de suivi de Systalink. Vide : rien n'est envoyé.
    webhook-url: ${SYSTALINK_WEBHOOK_URL:}
    webhook-secret: ${SYSTALINK_WEBHOOK_SECRET:}
  # Service IA de l'équipe (contracts/ia.yaml), appelé par l'API seulement. Plan des demandes de PME (#88).
  ia:
    # simule (sans réseau : local, tests, démo) ou service (le service IA, en HTTP avec le jeton interne).
    fournisseur: ${IA_FOURNISSEUR:simule}
    url: ${IA_URL:}
    jeton: ${IA_JETON_INTERNE:}
  # Module profils (#19) : lecture des données publiques GitHub pour générer le profil.
  github:
    # github (l'API de GitHub) ou simule (données factices : tests, démo sans réseau).
    source: ${GITHUB_SOURCE:github}
    # Facultatif mais conseillé en production : sans jeton, GitHub limite à 60 requêtes par heure pour tout le serveur.
    jeton: ${GITHUB_TOKEN:}
  # Dépôt Git de chaque tour de cercle (module cercles). aucun : les tours n'ont pas de dépôt (depot: null).
  depot-code:
    fournisseur: ${DEPOT_CODE:aucun}
    github:
      organisation: ${GITHUB_DEPOTS_ORGANISATION:}
      jeton: ${GITHUB_DEPOTS_JETON:}
      prives: ${GITHUB_DEPOTS_PRIVES:false}
  # Le paiement des jalons d'une mission (#178) : declares (v1, Jamii n'encaisse rien, chacun déclare). Un séquestre par
  # paiement mobile se branchera ici.
  paiements:
    fournisseur: ${PAIEMENTS:declares}
  # Le lien du produit d'un rendu de hackathon (#172) : aucune (pas d'appel, le lien reste « pas encore vérifié »)
  # ou simulee (sans réseau : local et tests ; un nom en .invalid ne répond pas).
  verification-lien:
    fournisseur: ${VERIFICATION_LIEN:aucune}

# Seule la santé est exposée, sur /health (contrat : contracts/socle.yaml).
# /health/liveness et /health/readiness servent de sondes à DataCloud.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Sans base, l'API ne peut rien servir : elle n'est pas « prête ».
        # La liveness, elle, ne dépend pas de la base (inutile de redémarrer l'API si la base tombe).
        readiness:
          include: readinessState,db

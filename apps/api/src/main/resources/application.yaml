# Toute la configuration passe par des variables d'environnement (DataCloud, CI) : voir .env.example.
spring:
  application:
    name: jamii-api
  datasource:
    # sslmode : « prefer » en local (pas de TLS dans docker compose), « require » ou « verify-full » en production.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:jamii}?sslmode=${POSTGRES_SSLMODE:prefer}
    username: ${POSTGRES_USER:jamii}
    # Pas de valeur par défaut : un mot de passe ne vit que dans l'environnement.
    password: ${POSTGRES_PASSWORD}
  jpa:
    # Le schéma appartient à Flyway : Hibernate vérifie, il ne modifie jamais.
    hibernate:
      ddl-auto: validate
    # Pas de requête SQL cachée pendant le rendu de la réponse.
    open-in-view: false
  # Le schéma des sessions est créé par Flyway (V2), comme le reste.
  session:
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          github:
            # Valeurs factices par défaut : l'API démarre sans application GitHub (tests, autres blocs).
            # Pour se connecter vraiment, créer une OAuth App GitHub et remplir .env (voir .env.example).
            client-id: ${GITHUB_CLIENT_ID:a-configurer}
            client-secret: ${GITHUB_CLIENT_SECRET:a-configurer}
            # read:user suffit pour le profil. user:email viendra avec le rattachement d'un e-mail vérifié.
            scope: read:user
            redirect-uri: "{baseUrl}/api/auth/{registrationId}/retour"
  # En local uniquement (./mvnw spring-boot:run) : Spring Boot lance le PostgreSQL de docker-compose.yml
  # et s'y connecte tout seul. docker compose lit lui-même le .env de la racine.
  # Ce module n'est pas embarqué dans le jar de production, ni actif pendant les tests.
  docker:
    compose:
      file: ../../docker-compose.yml
      # La base est partagée avec le service IA : l'arrêt de l'API ne l'arrête pas.
      lifecycle-management: start-only

server:
  # PORT : port imposé par la plateforme d'hébergement, s'il y en a un. API_PORT : choix local.
  port: ${PORT:${API_PORT:8080}}
  # Derrière le proxy HTTPS de l'hébergeur : l'adresse de retour GitHub doit être construite en https://.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 7d
      cookie:
        name: JAMII_SESSION
        http-only: true
        secure: true
        same-site: lax

jamii:
  # Adresse du front : on y renvoie l'utilisateur après la connexion.
  web-url: ${WEB_URL:http://localhost:5173}
  email:
    # simule : n'envoie rien (local et tests). Un adaptateur SMTP viendra avec le choix du service de messagerie.
    fournisseur: ${EMAIL_FOURNISSEUR:simule}
    # Local seulement : affiche le lien de connexion dans la console. Jamais en production (le lien est un mot de passe).
    afficher-lien: ${EMAIL_AFFICHER_LIEN:false}
  # Module profils (#19) : lecture des données publiques GitHub pour générer le profil.
  github:
    # github (l'API de GitHub) ou simule (données factices : tests, démo sans réseau).
    source: ${GITHUB_SOURCE:github}
    # Facultatif mais conseillé en production : sans jeton, GitHub limite à 60 requêtes par heure pour tout le serveur.
    jeton: ${GITHUB_TOKEN:}
  # Module communautes (#18) : qui propose une réponse à une question.
  communautes:
    # simulee (sans réseau : local, tests, démo) ou aucune (la question reste ouverte aux humains).
    # L'adaptateur du service IA de l'équipe (#69) s'ajoutera ici.
    ia: ${COMMUNAUTES_IA:simulee}

# Seule la santé est exposée, sur /health (contrat : contracts/socle.yaml).
# /health/liveness et /health/readiness servent de sondes à DataCloud.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Sans base, l'API ne peut rien servir : elle n'est pas « prête ».
        # La liveness, elle, ne dépend pas de la base (inutile de redémarrer l'API si la base tombe).
        readiness:
          include: readinessState,db

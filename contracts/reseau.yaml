openapi: 3.1.0
info:
  title: Jamii · Réseau (contacts, messages, notifications, recommandations)
  version: 0.1.0
  summary: Ce qui relie les développeurs entre eux, en dehors des cercles comme pour les remplir.
  description: |
    Responsable : @rev22rse22 (bloc #19). Règles communes : docs/api-conventions.md. Plan : docs/priorites.md.

    **Les recommandations** relient un cercle et des profils publiés (`profils.yaml`) :
    - à un développeur, les cercles **ouverts** dont les membres n'ont pas encore ses compétences, ceux de sa ville d'abord ;
    - à un membre d'un cercle ouvert, les profils publiés et `disponible` qui apportent une compétence qui manque au cercle.
    Le calcul est fait par l'API, sans IA : compétences en commun, ville, disponibilité. `raisons` dit pourquoi, en codes
    que le front traduit (« Il connaît Flutter, qui manque au cercle »). Un profil non publié n'est jamais recommandé.

    **Les messages** : n'importe quel utilisateur connecté peut écrire à un autre. Une conversation est désignée par
    l'**autre personne** (`personneId`) : il n'y a qu'une conversation par paire. Un message peut porter une **invitation
    à un cercle** (`cercleId`) : le destinataire voit le cercle et le bouton « Rejoindre le cercle », qui appelle
    `POST /api/cercles/{cercleId}/membres` (cercles.yaml). Contre le spam : 30 messages par heure et par personne, et
    10 premières prises de contact (premier message à quelqu'un) par jour.

    **Les contacts** : une demande, puis une acceptation. Les deux personnes deviennent contacts l'une de l'autre.
    Refuser une demande ou retirer un contact, c'est la même route (`DELETE`).

    **Les notifications** sont créées par l'API, jamais par le navigateur : message reçu, demande de contact reçue ou
    acceptée, quelqu'un a rejoint mon cercle, l'ordre de mon cercle est tiré, un tour est livré, un cercle recommandé
    vient d'ouvrir. Le front lit `GET /api/me/activite` toutes les 30 secondes **quand l'onglet est visible**, pour
    afficher les pastilles du menu : c'est ce qui rend la plateforme vivante sans WebSocket.

    **Vie privée** : jamais d'e-mail. Les messages ne sont lisibles que par leurs deux personnes. Ils partent dans
    l'export du compte et sont supprimés avec lui (`/api/me/export`, socle.yaml).

    **CSRF** : toute requête POST, PUT, PATCH ou DELETE envoie l'en-tête `X-XSRF-TOKEN` (socle.yaml, schéma `csrf`).

    **Codes d'erreur métier** (champ `code` de `Erreur`, réponse 409) : `deja_contact`, `demande_deja_envoyee`,
    `soi_meme`, `cercle_ferme` (invitation à un cercle complet ou déjà tiré), `pas_membre_du_cercle` (on n'invite
    qu'à un cercle dont on est membre).
servers:
  - url: http://localhost:8080

security:
  - session: []

tags:
  - { name: recommandations, description: 'Les cercles pour moi, les profils pour mon cercle.' }
  - { name: messages, description: 'Écrire à quelqu''un, inviter dans un cercle.' }
  - { name: contacts, description: 'Ajouter quelqu''un à ses contacts.' }
  - { name: notifications, description: 'Ce qui s''est passé depuis ma dernière visite.' }
  - { name: appels, description: 'Les appels audio et vidéo en tête-à-tête, en WebRTC (#157).' }
  - { name: presence, description: '« En ligne » et « Vu il y a … » (#157).' }

paths:
  /api/recommandations/cercles:
    get:
      tags: [recommandations]
      operationId: cerclesRecommandes
      summary: Les cercles ouverts qui ont besoin de mon profil, les plus pertinents d'abord
      description: Liste vide si je n'ai pas de profil publié. Jamais un cercle dont je suis déjà membre.
      parameters:
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 6 } }
      responses:
        '200':
          description: Les cercles recommandés.
          content:
            application/json:
              schema:
                type: object
                required: [elements]
                properties:
                  elements: { type: array, items: { $ref: '#/components/schemas/CercleRecommande' } }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/recommandations/profils:
    get:
      tags: [recommandations]
      operationId: profilsRecommandes
      summary: Les profils qui apportent ce qui manque à un cercle ouvert dont je suis membre
      parameters:
        - { name: cercleId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 6 } }
      responses:
        '200':
          description: Les profils recommandés. Liste vide si le cercle est complet ou déjà tiré.
          content:
            application/json:
              schema:
                type: object
                required: [elements, competencesManquantes]
                properties:
                  competencesManquantes:
                    type: array
                    description: Les compétences que le cercle n'a pas encore, d'après les idées déposées et les profils des membres.
                    items: { $ref: './projets.yaml#/components/schemas/Competence' }
                  elements: { type: array, items: { $ref: '#/components/schemas/ProfilRecommande' } }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/conversations:
    get:
      tags: [messages]
      operationId: listerConversations
      summary: Mes conversations, la plus récente d'abord
      parameters:
        - $ref: './socle.yaml#/components/parameters/Curseur'
        - $ref: './socle.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Une page de conversations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './socle.yaml#/components/schemas/Page'
                  - properties: { elements: { type: array, items: { $ref: '#/components/schemas/Conversation' } } }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/conversations/{personneId}/messages:
    parameters:
      - $ref: '#/components/parameters/PersonneId'
    get:
      tags: [messages]
      operationId: lireMessages
      summary: Les messages échangés avec une personne, les plus récents d'abord
      description: Lire la conversation la marque comme lue. Une page vide si on ne s'est jamais écrit.
      parameters:
        - $ref: './socle.yaml#/components/parameters/Curseur'
        - $ref: './socle.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Une page de messages et la personne.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './socle.yaml#/components/schemas/Page'
                  - required: [personne]
                    properties:
                      personne: { $ref: '#/components/schemas/Personne' }
                      elements: { type: array, items: { $ref: '#/components/schemas/Message' } }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
    post:
      tags: [messages]
      operationId: envoyerMessage
      summary: Écrire à une personne, avec une invitation à un cercle si on veut
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NouveauMessage' }
      responses:
        '201':
          description: Envoyé. Le destinataire reçoit une notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/conversations/{personneId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/PersonneId'
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [messages]
      operationId: modifierMessage
      summary: Corriger mon message (pendant 15 minutes)
      description: |
        Seulement mon message, pas supprimé, et ni une invitation ni un appel (`409 non_modifiable`). Au-delà de
        15 minutes après l'envoi : `409 delai_depasse`. Le message montre ensuite `modifieLe`.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [texte]
              properties:
                texte: { type: string, maxLength: 2000, description: 'Vide seulement si le message a des pièces jointes.' }
      responses:
        '200':
          description: Le message corrigé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { description: "Pas mon message, ou pas dans cette conversation.", $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }
    delete:
      tags: [messages]
      operationId: supprimerMessage
      summary: Supprimer mon message pour tout le monde
      description: |
        Le message garde sa place (« Message supprimé », `supprime: true`) ; son texte, son invitation et ses pièces
        jointes sont effacés pour de bon, fichiers compris. Sans effet s'il est déjà supprimé.
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: Supprimé. }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/conversations/{personneId}/messages/{messageId}/reactions:
    post:
      tags: [messages]
      operationId: reagirAuMessage
      summary: Ajouter ou retirer ma réaction (un emoji)
      description: |
        Une réaction par emoji et par personne (répéter ne change rien) ; 10 emojis différents au plus par personne et par
        message (409 `trop_de_reactions`). Seul un emoji est accepté (400). 409 `message_supprime`.
      security: [{ session: [], csrf: [] }]
      parameters:
        - $ref: '#/components/parameters/PersonneId'
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji, active]
              properties:
                emoji: { type: string, maxLength: 32 }
                active: { type: boolean, description: 'true pour ajouter, false pour retirer.' }
      responses:
        '200':
          description: Les réactions à jour du message.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Reaction' } }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/conversations/{personneId}/messages/{messageId}/transfert:
    parameters:
      - $ref: '#/components/parameters/PersonneId'
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [messages]
      operationId: transfererMessage
      summary: Transférer un message de cette conversation à d'autres personnes (5 au plus)
      description: |
        Un message envoyé ou reçu, pas supprimé, ni invitation ni appel. Chaque destinataire reçoit une copie marquée
        `transfere`, avec une copie privée de chaque pièce jointe (un fichier privé reste lié à une seule conversation).
        Les limites anti-spam des messages s'appliquent à chaque copie.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinataires]
              properties:
                destinataires: { type: array, minItems: 1, maxItems: 5, items: { type: string, format: uuid } }
      responses:
        '204': { description: Transféré. }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/conversations/{personneId}/ecriture:
    parameters:
      - $ref: '#/components/parameters/PersonneId'
    post:
      tags: [messages]
      operationId: signalerEcriture
      summary: Je suis en train d'écrire à cette personne (#157)
      description: >-
        Envoyé par le front au plus toutes les 3 secondes pendant la frappe. Éphémère : gardé en mémoire 6 secondes,
        jamais en base, et effacé quand le message part.
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Noté.
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
    get:
      tags: [messages]
      operationId: lireEcriture
      summary: Cette personne est-elle en train de m'écrire ?
      description: Lu toutes les 2 secondes tant que la conversation est ouverte et l'onglet visible. Jamais en cache.
      security:
        - session: []
      responses:
        '200':
          description: Vrai si elle a écrit dans les 6 dernières secondes.
          content:
            application/json:
              schema:
                type: object
                required: [ecrit]
                properties:
                  ecrit: { type: boolean }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/appels/ice:
    get:
      tags: [appels]
      operationId: serveursIce
      summary: Les serveurs STUN et TURN pour un appel (#157)
      description: >-
        À passer tels quels à `new RTCPeerConnection({ iceServers })`. Le relais TURN (notre coturn) a des identifiants
        temporaires (4 h), signés par l'API avec un secret partagé avec coturn (`use-auth-secret`) : aucun mot de passe
        fixe n'arrive au navigateur. `relais` est faux quand aucun TURN n'est configuré : STUN seulement. Jamais en cache.
      security:
        - session: []
      responses:
        '200':
          description: Les serveurs ICE.
          content:
            application/json:
              schema:
                type: object
                required: [iceServers, relais]
                properties:
                  iceServers:
                    type: array
                    items:
                      type: object
                      required: [urls]
                      properties:
                        urls: { type: array, items: { type: string } }
                        username: { type: [string, 'null'] }
                        credential: { type: [string, 'null'] }
                  relais: { type: boolean }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/conversations/{personneId}/appels:
    parameters:
      - $ref: '#/components/parameters/PersonneId'
    post:
      tags: [appels]
      operationId: appeler
      summary: Appeler une personne, en audio ou en vidéo, dans Jamii (#157)
      description: >-
        WebRTC en tête-à-tête : le son et l'image passent directement entre les deux navigateurs (ou par notre relais
        TURN), jamais par l'API. L'API transmet seulement l'offre SDP complète (candidats ICE inclus) à la personne
        appelée, qui la lit avec `GET /api/appels/entrant`. Un message de la conversation garde la trace de l'appel.
        Mêmes règles qu'un message : pas à soi-même, même limite anti-spam. Un appel qui sonnait déjà entre ces deux
        personnes est annulé. Après 45 secondes sans réponse, l'appel est manqué.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offre]
              properties:
                offre: { type: string, maxLength: 30000, description: 'La description SDP de l''offre, qui commence par `v=0`.' }
                video: { type: boolean, default: false, description: 'Vrai : appel vidéo. Faux : appel vocal (la caméra peut s''allumer ensuite).' }
      responses:
        '201':
          description: L'appel, qui sonne.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appel' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/appels/entrant:
    get:
      tags: [appels]
      operationId: appelEntrant
      summary: L'appel qui sonne pour moi en ce moment
      description: >-
        Lu toutes les 2 secondes par le front tant qu'on est connecté et que l'onglet est visible (pas de WebSocket).
        Porte l'`offre` à passer à `setRemoteDescription`.
      security:
        - session: []
      responses:
        '200':
          description: Un appel sonne.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appel' }
        '204':
          description: Personne n'appelle.
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/appels/{appelId}:
    parameters:
      - name: appelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [appels]
      operationId: lireAppel
      summary: Où en est un appel
      description: >-
        Pour les deux personnes seulement (sinon 404). L'appelant le lit toutes les secondes tant que ça sonne : il y
        trouve la `reponse` quand l'autre décroche, ou le refus.
      security:
        - session: []
      responses:
        '200':
          description: L'appel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appel' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/appels/{appelId}/reponse:
    parameters:
      - name: appelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [appels]
      operationId: decrocher
      summary: Décrocher
      description: >-
        Seule la personne appelée, tant que ça sonne. Sa réponse SDP (candidats ICE inclus) part chez l'appelant.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reponse]
              properties:
                reponse: { type: string, maxLength: 30000 }
      responses:
        '200':
          description: L'appel après l'action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appel' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/appels/{appelId}/refus:
    parameters:
      - name: appelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [appels]
      operationId: refuserAppel
      summary: Refuser un appel qui sonne
      description: >-
        Seule la personne appelée.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: L'appel après l'action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appel' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/appels/{appelId}/fin:
    parameters:
      - name: appelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [appels]
      operationId: raccrocher
      summary: Raccrocher
      description: >-
        Pour l'une ou l'autre personne : un appel qui sonne est annulé, un appel en cours est terminé. Sans effet sur un appel déjà fini. Les SDP (adresses réseau) sont effacées.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: L'appel après l'action.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appel' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/me/contacts:
    get:
      tags: [contacts]
      operationId: listerContacts
      summary: Mes contacts, ou les demandes de contact reçues ou envoyées
      parameters:
        - name: statut
          in: query
          description: '`accepte` : mes contacts (par défaut). `recue` : les demandes à qui je dois répondre. `envoyee` : celles qui attendent une réponse.'
          schema: { type: string, enum: [accepte, recue, envoyee], default: accepte }
        - $ref: './socle.yaml#/components/parameters/Curseur'
        - $ref: './socle.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Une page de contacts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './socle.yaml#/components/schemas/Page'
                  - properties: { elements: { type: array, items: { $ref: '#/components/schemas/Contact' } } }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/contacts/{personneId}:
    parameters:
      - $ref: '#/components/parameters/PersonneId'
    get:
      tags: [contacts]
      operationId: lireLienContact
      summary: Où j'en suis avec cette personne (pour le bouton de son profil)
      responses:
        '200':
          description: Le lien, `aucun` si on n'est pas en contact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LienContact' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
    put:
      tags: [contacts]
      operationId: ajouterContact
      summary: Demander à être en contact, ou accepter sa demande si elle m'en a envoyé une
      description: Sans corps. Idempotent. `409 soi_meme` si c'est moi.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Le lien après l'action (`envoyee`, ou `accepte` si la personne l'avait déjà demandé).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LienContact' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }
    delete:
      tags: [contacts]
      operationId: retirerContact
      summary: Refuser une demande, annuler la mienne ou retirer un contact
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: 'Plus de lien. Idempotent : `204` même s''il n''y en avait pas.' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/me/activite:
    get:
      tags: [notifications]
      operationId: lireActivite
      summary: Les compteurs des pastilles du menu (appelé toutes les 30 secondes, onglet visible)
      responses:
        '200':
          description: Les compteurs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activite' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/presence:
    get:
      tags: [presence]
      operationId: lirePresence
      summary: Qui est en ligne, et quand les autres ont été vus
      description: |
        Chaque requête d'une personne connectée note son activité (au plus une fois par minute). « En ligne » : active
        depuis moins de 2 minutes. Sinon `vuLe`, arrondi à la minute, seulement s'il date de moins de 7 jours.
        Une personne qui cache sa présence apparaît toujours hors ligne, sans date. Réciproque : si je cache la mienne,
        `masquee` vaut true et je ne vois celle de personne.
      parameters:
        - name: personnes
          in: query
          required: true
          description: Les identifiants, séparés par des virgules (50 au plus).
          schema: { type: string }
      responses:
        '200':
          description: Une présence par personne demandée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Presences' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/me/presence:
    get:
      tags: [presence]
      operationId: lireMaVisibilite
      summary: Est-ce que je montre quand je suis en ligne ? (oui par défaut)
      responses:
        '200':
          description: Mon choix.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisibilitePresence' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
    put:
      tags: [presence]
      operationId: changerMaVisibilite
      summary: Montrer ou cacher quand je suis en ligne
      security: [{ session: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisibilitePresence' }
      responses:
        '200':
          description: Le choix enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisibilitePresence' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/me/notifications:
    get:
      tags: [notifications]
      operationId: listerNotifications
      summary: Mes notifications, les plus récentes d'abord (gardées 30 jours)
      parameters:
        - $ref: './socle.yaml#/components/parameters/Curseur'
        - $ref: './socle.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Une page de notifications.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './socle.yaml#/components/schemas/Page'
                  - properties: { elements: { type: array, items: { $ref: '#/components/schemas/Notification' } } }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

  /api/me/notifications/lues:
    post:
      tags: [notifications]
      operationId: marquerNotificationsLues
      summary: Marquer toutes mes notifications comme lues (à l'ouverture de la liste)
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: Toutes lues. }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }

components:
  securitySchemes:
    session: { $ref: './socle.yaml#/components/securitySchemes/session' }
    csrf: { $ref: './socle.yaml#/components/securitySchemes/csrf' }

  parameters:
    PersonneId:
      name: personneId
      in: path
      required: true
      description: L'identifiant de l'autre personne.
      schema: { type: string, format: uuid }

  schemas:
    EtatPresence:
      type: object
      required: [personneId, enLigne, vuLe]
      properties:
        personneId: { type: string, format: uuid }
        enLigne: { type: boolean }
        vuLe:
          type: [string, 'null']
          format: date-time
          description: Arrondi à la minute. null si en ligne, caché, jamais vu ou vu il y a plus de 7 jours.

    Presences:
      type: object
      required: [masquee, elements]
      properties:
        masquee: { type: boolean, description: 'Je cache ma présence : je ne vois pas celle des autres.' }
        elements: { type: array, items: { $ref: '#/components/schemas/EtatPresence' } }

    VisibilitePresence:
      type: object
      required: [visible]
      properties:
        visible: { type: boolean }

    Personne:
      type: object
      description: Ce que le réseau montre d'une personne. Jamais son e-mail.
      required: [id, nom]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        ville: { type: [string, 'null'] }

    RaisonRecommandation:
      type: string
      description: |
        Pourquoi c'est recommandé, traduit par le front.
        `competence_manquante` : la personne a une compétence qui manque au cercle (`competences` dit lesquelles).
        `meme_ville` : même ville. `disponible` : la personne s'est dite disponible. `presque_complet` : il reste une place.
      enum: [competence_manquante, meme_ville, disponible, presque_complet]

    CercleRecommande:
      type: object
      required: [cercle, raisons, competences]
      properties:
        cercle: { $ref: './cercles.yaml#/components/schemas/CercleResume' }
        raisons: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RaisonRecommandation' } }
        competences:
          type: array
          description: Mes compétences qui manquent à ce cercle.
          items: { $ref: './projets.yaml#/components/schemas/Competence' }

    ProfilRecommande:
      type: object
      required: [profil, raisons, competences, lien]
      properties:
        profil: { $ref: './profils.yaml#/components/schemas/ProfilResume' }
        raisons: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RaisonRecommandation' } }
        competences:
          type: array
          description: Ses compétences qui manquent au cercle.
          items: { $ref: './projets.yaml#/components/schemas/Competence' }
        invite: { type: boolean, description: 'Un membre du cercle lui a déjà envoyé une invitation à ce cercle.' }
        lien: { $ref: '#/components/schemas/StatutLien' }

    NouveauMessage:
      type: object
      required: [texte]
      properties:
        texte: { type: string, maxLength: 2000, description: 'Texte mis en forme (petit Markdown). Vide seulement avec des pièces jointes.' }
        cercleId:
          type: string
          format: uuid
          description: Pour inviter la personne à un cercle ouvert dont je suis membre.
        pieces: { $ref: './fichiers.yaml#/components/schemas/Pieces' }
        reponseA: { type: string, format: uuid, description: 'Le message auquel je réponds, de la même conversation (#157).' }

    Citation:
      type: object
      description: Le message auquel celui-ci répond, en bref.
      required: [id, deMoi, texte, supprime]
      properties:
        id: { type: string, format: uuid }
        deMoi: { type: boolean }
        texte: { type: string, maxLength: 140, description: 'Son début. Vide s''il a été supprimé ou n''a qu''une pièce jointe.' }
        sorte: { type: [string, 'null'], enum: [image, video, document, audio, null], description: 'La sorte de sa première pièce jointe.' }
        supprime: { type: boolean }

    Reaction:
      type: object
      required: [emoji, nombre, deMoi, noms]
      properties:
        emoji: { type: string, maxLength: 32 }
        nombre: { type: integer, minimum: 1 }
        deMoi: { type: boolean, description: "J'ai réagi avec cet emoji." }
        noms:
          type: array
          maxItems: 10
          description: 'Qui a réagi (10 au plus), pour le survol. « moi » pour moi.'
          items: { type: string }

    Message:
      type: object
      required: [id, deMoi, texte, envoyeLe, piecesJointes, supprime, transfere, reactions]
      properties:
        id: { type: string, format: uuid }
        deMoi: { type: boolean, description: "C'est moi qui l'ai écrit." }
        reponseA:
          oneOf:
            - $ref: '#/components/schemas/Citation'
            - { type: 'null' }
        modifieLe: { type: [string, 'null'], format: date-time, description: 'Quand il a été corrigé, s''il l''a été.' }
        supprime: { type: boolean, description: 'Supprimé pour tout le monde : texte et pièces jointes vides.' }
        transfere: { type: boolean, description: 'Une copie transférée depuis une autre conversation.' }
        reactions:
          type: array
          description: 'Les réactions, dans l''ordre de la première de chaque emoji. Vide pour un message supprimé.'
          items: { $ref: '#/components/schemas/Reaction' }
        texte: { type: string, description: 'Texte mis en forme (petit Markdown), affiché échappé.' }
        piecesJointes: { type: array, maxItems: 6, items: { $ref: './fichiers.yaml#/components/schemas/PieceJointe' } }
        invitation:
          oneOf:
            - $ref: '#/components/schemas/InvitationCercle'
            - { type: 'null' }
        envoyeLe: { type: string, format: date-time }
        luLe: { type: [string, 'null'], format: date-time, description: Quand le destinataire l'a lu. }
        appel:
          description: >-
            Si le message garde la trace d'un appel (#157). Un appel WebRTC a son `id`, son `statut` et sa durée ; un
            ancien appel par Jitsi n'a que son `url` (encore en cours pendant une heure).
          oneOf:
            - type: object
              required: [enCours, video]
              properties:
                id: { type: [string, 'null'], format: uuid }
                url: { type: [string, 'null'], format: uri }
                enCours: { type: boolean }
                statut: { type: [string, 'null'], enum: [sonne, en_cours, termine, refuse, manque, annule, null] }
                video: { type: boolean }
                dureeSecondes: { type: [integer, 'null'], description: 'Pour un appel décroché puis terminé.' }
            - { type: 'null' }

    Appel:
      type: object
      description: >-
        Un appel WebRTC vu par l'une des deux personnes. `offre` n'est donnée qu'à la personne appelée tant que ça
        sonne, `reponse` qu'à l'appelant : chacun ne reçoit que ce dont son navigateur a besoin.
      required: [id, statut, video, deMoi, personne, creeLe]
      properties:
        id: { type: string, format: uuid }
        statut: { type: string, enum: [sonne, en_cours, termine, refuse, manque, annule] }
        video: { type: boolean }
        deMoi: { type: boolean, description: "Vrai si c'est moi qui appelle." }
        personne: { $ref: '#/components/schemas/Personne' }
        offre: { type: [string, 'null'] }
        reponse: { type: [string, 'null'] }
        creeLe: { type: string, format: date-time }
        reponduLe: { type: [string, 'null'], format: date-time }
        termineLe: { type: [string, 'null'], format: date-time }

    InvitationCercle:
      type: object
      description: Le cercle tel qu'il est maintenant, pour savoir s'il reste de la place.
      required: [cercle]
      properties:
        cercle: { $ref: './cercles.yaml#/components/schemas/CercleResume' }

    Conversation:
      type: object
      required: [personne, dernierMessage, nonLus]
      properties:
        personne: { $ref: '#/components/schemas/Personne' }
        dernierMessage: { $ref: '#/components/schemas/Message' }
        nonLus: { type: integer, minimum: 0 }

    StatutLien:
      type: string
      description: '`aucun`, `envoyee` (j''ai demandé), `recue` (elle m''a demandé), `accepte` (contacts).'
      enum: [aucun, envoyee, recue, accepte]

    LienContact:
      type: object
      required: [statut]
      properties:
        statut: { $ref: '#/components/schemas/StatutLien' }
        depuis: { type: [string, 'null'], format: date-time }

    Contact:
      type: object
      required: [personne, statut, depuis]
      properties:
        personne: { $ref: '#/components/schemas/Personne' }
        statut: { $ref: '#/components/schemas/StatutLien' }
        depuis: { type: string, format: date-time }
        competences:
          type: array
          maxItems: 5
          description: Ses principales compétences, si son profil est publié.
          items: { $ref: './projets.yaml#/components/schemas/Competence' }

    Activite:
      type: object
      required: [notificationsNonLues, messagesNonLus, demandesContact]
      properties:
        notificationsNonLues: { type: integer, minimum: 0 }
        messagesNonLus: { type: integer, minimum: 0 }
        demandesContact: { type: integer, minimum: 0, description: Demandes de contact reçues en attente. }

    TypeNotification:
      type: string
      enum: [message_recu, invitation_cercle, demande_contact, contact_accepte, membre_rejoint, tirage_effectue, tour_livre, cercle_recommande, proposition_recue, devis_recu, mission_attribuee, candidature_recue, candidature_acceptee, candidature_refusee, candidature_attente, invitation_equipe]

    Notification:
      type: object
      description: |
        Le front écrit la phrase à partir de `type`, `personne` et `cercle`, et mène à `lien`
        (chemin du front : `/messages/{id}`, `/cercles/{id}`, `/contacts`).
      required: [id, type, lien, creeLe, lue]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TypeNotification' }
        personne:
          oneOf:
            - $ref: '#/components/schemas/Personne'
            - { type: 'null' }
        cercle:
          oneOf:
            - { $ref: './cercles.yaml#/components/schemas/CercleResume' }
            - { type: 'null' }
        lien: { type: string, pattern: '^/[a-z0-9/-]*$', examples: ['/cercles/a0c1e2c1-0000-4000-8000-00000000da4a'] }
        creeLe: { type: string, format: date-time }
        lue: { type: boolean }

openapi: 3.1.0
info:
  title: Jamii · Demandes de PME
  version: 0.2.0
  summary: Une personne ou une PME décrit son besoin, Jamii l'oriente vers Systalink ou vers les bons développeurs.
  description: |
    Responsable : @sowibrr (bloc #17). Règles communes : docs/api-conventions.md. Demande #88. Modèle : docs/modele-donnees.md.

    **Le parcours** (étape 3 de la démo) :
    1. La PME décrit son besoin : `POST /api/demandes`. L'API enregistre la demande et **dépose la tâche `plan_projet`**
       (`source: demande_pme`) dans le service IA (`ia.yaml`, interne : le navigateur ne l'appelle jamais).
    2. Le navigateur relit `GET /api/demandes/{id}` toutes les 2 secondes, une minute au plus, jusqu'à
       `plan.statut` = `terminee` ou `echouee`.
    3. « Lancer le projet avec ce plan » appelle `POST /api/projets` avec `origine: demande` et `demandeId`
       (`projets.yaml`). Le `409 demande_deja_prise` y est géré.

    **Orientation (v0.2, #20, étape 1 de la démo).** La tâche déposée est désormais `orientation_besoin`
    (`ia.yaml`) : **un seul appel IA** qui relie le besoin au catalogue Systalink et, s'il faut des développeurs,
    produit le plan. `orientation` porte ce résultat. `recommandations` est **calculé par l'API, sans IA** : un
    score sur les cartes de compétences publiées (`profils.yaml`), la fiabilité, la disponibilité et la proximité, avec
    la raison de chaque choix. `plan` reste, pour les écrans existants : c'est `orientation.resultat.plan`.

    **Systalink.** Les services adaptés sont **montrés à la personne** dans le résultat : aucune donnée ne sort de
    Jamii pour ça. La personne peut en plus cocher « Recevoir les offres Systalink adaptées à mon projet »
    (`offresSystalink`, **`false` par défaut**, modifiable à tout moment) : seulement alors son besoin et son contact
    apparaissent à Systalink (`systalink.yaml`, clients suivis). Les tendances anonymes ne demandent pas d'accord.

    **Connexion** : requise, par GitHub ou par e-mail. Une PME n'a pas besoin de compte GitHub.

    **Qui voit une demande** : son auteur seulement. Pour tout autre utilisateur, la demande n'existe pas (`404`, jamais
    `403`, pour ne pas révéler qu'elle existe). Une liste publique des demandes, pour que des équipes les choisissent,
    n'est pas dans ce contrat : elle demande une décision (voir la PR).

    **Le plan vient du service IA, jamais du navigateur.** L'API relit l'état de la tâche à chaque `GET` : il n'y a pas de
    copie du plan en base. Si le service IA ne répond pas, la demande reste visible avec `plan.statut` = `echouee`
    (`delai_depasse`) : on ne perd jamais le texte de la PME. Un plan calculé sans IA (`origine: repli`) est signalé à la
    PME.

    **Texte de la PME** : `titre` et `description` sont du texte brut, affiché échappé. Ils sont envoyés au service IA comme
    des **données**, jamais comme des consignes.

    **Données personnelles** : le texte d'une demande est une donnée personnelle de son auteur. Il fait partie de l'export
    (`GET /api/me/export`) et il est supprimé avec le compte (`DELETE /api/me`).

    **CSRF** : toute requête POST envoie l'en-tête `X-XSRF-TOKEN` (socle.yaml, schéma `csrf`).
servers:
  - url: http://localhost:8080

security:
  - session: []

tags:
  - { name: demandes, description: Décrire un besoin et suivre le plan proposé. }

paths:
  /api/demandes:
    post:
      tags: [demandes]
      operationId: creerDemande
      summary: Décrire un besoin (la PME devient l'auteure de la demande)
      description: |
        Répond `201` tout de suite, avant la fin du plan : `plan.statut` vaut `en_attente`. La limite est celle de
        `ia.yaml` : **10 plans par heure et par utilisateur** (`429` avec `Retry-After`). Une demande refusée par la
        limite n'est pas enregistrée.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NouvelleDemande' }
      responses:
        '201':
          description: Demande enregistrée, plan en attente.
          headers: { Location: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Demande' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/demandes/{demandeId}/offres-systalink:
    parameters:
      - name: demandeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [demandes]
      operationId: choisirOffresSystalink
      summary: Recevoir (ou ne plus recevoir) les offres Systalink adaptées à ce besoin
      description: |
        L'auteur seulement. Retirer son accord retire tout de suite la demande des clients suivis de Systalink
        (et ce qui a déjà été envoyé par le webhook ne peut pas être repris : le dire à côté de la case).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accepte]
              properties:
                accepte: { type: boolean }
      responses:
        '200':
          description: La demande à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Demande' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/demandes/{demandeId}:
    parameters:
      - name: demandeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [demandes]
      operationId: lireDemande
      summary: La demande et l'état de son plan (à relire toutes les 2 secondes pendant une minute)
      description: "La réponse n'est jamais mise en cache (`Cache-Control: no-store`)."
      responses:
        '200':
          description: La demande.
          headers:
            Cache-Control: { schema: { type: string, examples: ['no-store'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Demande' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

components:
  securitySchemes:
    session: { $ref: './socle.yaml#/components/securitySchemes/session' }
    csrf: { $ref: './socle.yaml#/components/securitySchemes/csrf' }

  schemas:
    NouvelleDemande:
      type: object
      additionalProperties: false
      required: [titre, description]
      properties:
        titre: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 20, maxLength: 4000, description: 'Le besoin, avec les mots de la PME. Texte brut.' }
        dureeSemaines: { type: [integer, 'null'], minimum: 1, maximum: 26, description: 'Durée souhaitée, si connue.' }
        secteur: { type: [string, 'null'], maxLength: 60, description: 'Choisi dans une liste par le front, ou libre.' }
        ville: { type: [string, 'null'], maxLength: 80 }
        pays: { oneOf: [{ $ref: './profils.yaml#/components/schemas/Pays' }, { type: 'null' }] }
        offresSystalink: { type: boolean, default: false, description: '« Recevoir les offres Systalink adaptées à mon projet ». Jamais pré-cochée.' }

    Demande:
      type: object
      required: [id, titre, description, dureeSemaines, creeLe, plan]
      properties:
        id: { type: string, format: uuid }
        titre: { type: string }
        description: { type: string, description: 'Texte brut, affiché échappé.' }
        dureeSemaines: { type: [integer, 'null'] }
        creeLe: { type: string, format: date-time }
        projetId:
          type: [string, 'null']
          format: uuid
          description: Le projet lancé à partir de cette demande (`projets.yaml`), s'il y en a un. Absent ou `null` sinon.
        secteur: { type: [string, 'null'] }
        ville: { type: [string, 'null'] }
        pays: { type: [string, 'null'] }
        offresSystalink: { type: boolean }
        plan: { $ref: '#/components/schemas/PlanDeLaDemande' }
        orientation: { $ref: '#/components/schemas/OrientationDeLaDemande' }
        recommandations:
          type: array
          maxItems: 5
          description: |
            Les développeurs qui peuvent répondre au besoin, du plus adapté au moins adapté. Vide tant que
            l'orientation n'est pas terminée, ou si `developpeursNecessaires` vaut `false`. Seuls les profils publiés.
          items: { $ref: '#/components/schemas/Recommandation' }

    PlanDeLaDemande:
      type: object
      description: L'état de la tâche `plan_projet`, relu par l'API dans le service IA.
      required: [statut]
      properties:
        statut: { type: string, enum: [en_attente, en_cours, terminee, echouee] }
        origine:
          type: string
          description: 'Présent si `terminee`. `repli` : plan calculé sans IA, à montrer à la PME. `cache` : plan déjà produit pour la même demande.'
          enum: [ia, cache, repli]
        resultat:
          description: Présent si `terminee`.
          $ref: './ia.yaml#/components/schemas/PlanProjet'
        erreurCode:
          type: string
          description: 'Présent si `echouee`. `delai_depasse` couvre aussi un service IA qui ne répond pas.'
          enum: [entree_refusee, resultat_invalide, delai_depasse]

    OrientationDeLaDemande:
      type: object
      description: L'état de la tâche `orientation_besoin`, relu par l'API dans le service IA.
      required: [statut]
      properties:
        statut: { type: string, enum: [en_attente, en_cours, terminee, echouee] }
        origine:
          type: string
          enum: [ia, cache, repli]
          description: 'Présent si `terminee`. `repli` : « Analyse automatique indisponible, voici une première proposition ».'
        resultat:
          description: Présent si `terminee`.
          $ref: './ia.yaml#/components/schemas/Orientation'
        erreurCode:
          type: string
          enum: [entree_refusee, resultat_invalide, delai_depasse]

    Recommandation:
      type: object
      description: Un développeur recommandé, avec la raison. Jamais l'e-mail.
      required: [utilisateurId, nom, score, raisons, competencesCouvertes]
      properties:
        utilisateurId: { type: string, format: uuid }
        nom: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        ville: { type: [string, 'null'] }
        pays: { type: [string, 'null'] }
        score: { type: integer, minimum: 0, maximum: 100, description: 'Pour trier. Le front affiche les raisons, pas le chiffre.' }
        competencesCouvertes:
          type: array
          items: { $ref: './projets.yaml#/components/schemas/Competence' }
        raisons:
          type: array
          maxItems: 4
          description: 'Phrases courtes et vérifiables : « React, confirmé (3 dépôts) », « Disponible », « Dakar ».'
          items: { type: string, maxLength: 120 }

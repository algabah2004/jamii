openapi: 3.1.0
info:
  title: Jamii · Espace Systalink
  version: 0.2.0
  summary: Tableau de bord, tendances du marché, clients qui ont demandé à être suivis, et mesure des « moments Systalink ».
  description: |
    Responsable : @Amar233-ui (bloc #18). Règles communes : docs/api-conventions.md. Modèle : docs/modele-donnees.md (table `moment_systalink`).

    **Ce que le tableau de bord prouve** : Jamii amène des utilisateurs et des projets au cloud Systalink.
    Il montre seulement des **chiffres agrégés**, jamais une personne, un nom ou un identifiant.

    **Lecture publique** : le tableau de bord se lit sans connexion. Il ne contient que des comptes, et un pays
    regroupe au moins 5 inscrits (sinon il passe dans `autres`). Personne ne peut donc être reconnu.

    **Ce qu'on ne mesure pas** : le passage à une offre payante DataCloud. Jamii ne voit pas les achats faits chez
    Systalink, et on n'invente pas ce chiffre. Il faudra une donnée de Systalink (API ou webhook) pour l'ajouter.

    **Les moments Systalink** : quand un module propose un service Systalink au bon moment (DataCloud au moment de
    mettre en ligne, Orion pour le besoin simple d'une PME…), l'API crée un moment et renvoie une `PropositionSystalink`
    que le front affiche. Quand l'utilisateur suit la proposition, le front appelle `accepter`. Le moment ne garde
    **aucun identifiant d'utilisateur**.

    **Tendances du marché (v0.2, #20)** : ce que les besoins décrits sur Jamii disent du marché (secteurs, pays,
    services Systalink adaptés, compétences qui manquent). Agrégé et anonyme, lecture publique, mêmes seuils que le
    tableau de bord : une case de moins de 5 besoins passe dans `autres`. Implémentation : module `demandes`.

    **Clients suivis (v0.2, #20)** : uniquement les personnes qui ont coché « Recevoir les offres Systalink adaptées
    à mon projet » (`demandes.yaml`, `offresSystalink`), jamais pré-cochée. Si elles retirent leur accord, elles
    disparaissent tout de suite de la liste. Réservé au rôle `systalink` (ou `admin`), accordé par la configuration
    (`SYSTALINK_ACCES`, liste de logins GitHub ou d'e-mails). Systalink peut les recevoir dans son propre outil de suivi
    par un **webhook signé** (`webhooks.clientSuivi`) ou un export CSV.
servers:
  - url: http://localhost:8080

tags:
  - { name: tableau-de-bord, description: 'Chiffres agrégés pour Systalink (lecture publique).' }
  - { name: moments, description: 'Mesure de chaque service Systalink proposé, puis accepté.' }
  - { name: tendances, description: 'Ce que les besoins décrits sur Jamii disent du marché (lecture publique, anonyme).' }
  - { name: clients-suivis, description: 'Les personnes qui ont demandé à recevoir les offres Systalink (rôle systalink).' }

paths:
  /api/systalink/tableau-de-bord:
    get:
      tags: [tableau-de-bord]
      operationId: tableauDeBordSystalink
      summary: Les chiffres agrégés du tableau de bord Systalink
      description: |
        Calculé par l'API et mis en cache 5 minutes : la page tient la charge même si toute la salle l'ouvre en même temps.
        Les compteurs `nouveaux…` portent sur la période demandée. Les totaux portent sur toute la vie de Jamii.
      security: []
      parameters:
        - name: periode
          in: query
          schema: { $ref: '#/components/schemas/Periode' }
      responses:
        '200':
          description: Les chiffres.
          headers:
            Cache-Control:
              schema: { type: string, examples: ['public, max-age=300'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableauDeBord' }
              examples:
                demo:
                  value:
                    periode: mois
                    calculeLe: '2026-11-13T10:00:00Z'
                    inscrits: { total: 64, nouveaux: 41, parPays: [{ pays: SN, nombre: 22 }, { pays: CI, nombre: 11 }, { pays: KE, nombre: 9 }, { pays: NG, nombre: 8 }, { pays: CM, nombre: 6 }], autres: 8 }
                    projets: { crees: 23, nouveaux: 17, enLigne: 9, surDatacloud: 7 }
                    cercles: { actifs: 3, termines: 1, toursLivres: 7, nouveauxToursLivres: 4, membres: { total: 22, parPays: [{ pays: SN, nombre: 9 }, { pays: CI, nombre: 6 }], autres: 7 } }
                    moments:
                      - { service: datacloud, proposes: 12, acceptes: 7 }
                      - { service: orion, proposes: 5, acceptes: 2 }
                      - { service: yokk, proposes: 8, acceptes: 3 }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }

  /api/systalink/moments/{momentId}/accepter:
    post:
      tags: [moments]
      operationId: accepterMomentSystalink
      summary: L'utilisateur a suivi la proposition d'un service Systalink
      description: |
        À appeler quand l'utilisateur clique sur le lien de la proposition, juste avant d'ouvrir `lien`.
        **Idempotent** : seul le premier appel compte (`accepte_le` n'est jamais écrasé). Un second clic, ou un double
        envoi, répond aussi `204`, et le taux ne peut donc pas être gonflé en cliquant plusieurs fois.
        Il faut être connecté : les identifiants de moment ne sont donnés qu'à l'utilisateur qui a reçu la proposition.
      security:
        - session: []
          csrf: []
      parameters:
        - name: momentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Acceptation enregistrée (ou déjà enregistrée). }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/systalink/tendances:
    get:
      tags: [tendances]
      operationId: tendancesSystalink
      summary: Les tendances du marché, à partir des besoins décrits sur Jamii
      security: []
      parameters:
        - name: periode
          in: query
          schema: { $ref: '#/components/schemas/Periode' }
      responses:
        '200':
          description: Chiffres agrégés.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tendances' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }

  /api/systalink/clients-suivis:
    get:
      tags: [clients-suivis]
      operationId: listerClientsSuivis
      summary: Les personnes qui ont demandé à recevoir les offres Systalink, les plus récentes d'abord
      security:
        - session: []
      description: Rôle `systalink` ou `admin`. Pagination par curseur (docs/api-conventions.md).
      parameters:
        - name: statut
          in: query
          schema: { $ref: '#/components/schemas/StatutClient' }
        - name: curseur
          in: query
          schema: { type: string }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Une page.
          headers:
            Cache-Control: { schema: { type: string, examples: ['no-store'] } }
          content:
            application/json:
              schema:
                type: object
                required: [elements]
                properties:
                  elements: { type: array, items: { $ref: '#/components/schemas/ClientSuivi' } }
                  curseurSuivant: { type: [string, 'null'] }
            text/csv:
              schema: { type: string, description: 'Avec `Accept: text/csv` : toutes les lignes du filtre, sans pagination, en UTF-8.' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }

  /api/systalink/clients-suivis/{demandeId}:
    patch:
      tags: [clients-suivis]
      operationId: suivreClient
      summary: Noter où en est le suivi (contacté, devenu client…)
      security:
        - session: []
          csrf: []
      parameters:
        - name: demandeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [statut]
              properties:
                statut: { $ref: '#/components/schemas/StatutClient' }
      responses:
        '200':
          description: Le client suivi, à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientSuivi' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

webhooks:
  clientSuivi:
    post:
      tags: [clients-suivis]
      operationId: webhookClientSuivi
      security: []
      summary: Envoyé à l'outil de Systalink quand une personne accepte de recevoir ses offres
      description: |
        Adresse : `SYSTALINK_WEBHOOK_URL`. Sans elle, rien n'est envoyé. Signature :
        `X-Jamii-Signature: sha256=<HMAC-SHA256 hexadécimal de "<X-Jamii-Horodatage>.<corps>" avec SYSTALINK_WEBHOOK_SECRET>`.
        Le destinataire refuse un horodatage de plus de 5 minutes (rejeu). 3 essais au plus ; un échec ne bloque jamais
        la personne. Le corps ne contient que ce que la personne a accepté de partager.
      parameters:
        - { name: X-Jamii-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Jamii-Horodatage, in: header, required: true, schema: { type: integer, description: Secondes depuis 1970. } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientSuivi' }
      responses:
        '2XX': { description: Reçu. }

components:
  securitySchemes:
    session: { $ref: './socle.yaml#/components/securitySchemes/session' }
    csrf: { $ref: './socle.yaml#/components/securitySchemes/csrf' }

  schemas:
    Periode:
      type: string
      enum: [semaine, mois, tout]
      default: mois
      description: Fenêtre des compteurs `nouveaux…` (7 jours, 30 jours ou depuis le début).

    ServiceSystalink:
      type: string
      enum: [datacloud, orion, yokk, systatalk, systaforms, domaines]
      description: Le service Systalink proposé. On ajoute une valeur quand un module se met à proposer un nouveau service.

    TableauDeBord:
      type: object
      required: [periode, calculeLe, inscrits, projets, cercles, moments]
      properties:
        periode: { $ref: '#/components/schemas/Periode' }
        calculeLe: { type: string, format: date-time, description: Moment du calcul (le cache peut avoir jusqu'à 5 minutes). }
        inscrits:
          type: object
          required: [total, nouveaux, parPays, autres]
          properties:
            total: { type: integer, minimum: 0 }
            nouveaux: { type: integer, minimum: 0 }
            parPays:
              type: array
              description: Les pays qui comptent **au moins 5 inscrits**, du plus grand au plus petit.
              items:
                type: object
                required: [pays, nombre]
                properties:
                  pays: { $ref: './profils.yaml#/components/schemas/Pays' }
                  nombre: { type: integer, minimum: 5 }
            autres:
              type: integer
              minimum: 0
              description: Inscrits d'un pays de moins de 5 inscrits, ou sans pays déclaré.
        projets:
          type: object
          required: [crees, nouveaux, enLigne, surDatacloud]
          properties:
            crees: { type: integer, minimum: 0, description: Projets créés sur Jamii. }
            nouveaux: { type: integer, minimum: 0, description: Projets créés pendant la période. }
            enLigne: { type: integer, minimum: 0, description: 'Projets avec un déploiement `en_ligne` vérifié, quel que soit l''hébergeur.' }
            surDatacloud: { type: integer, minimum: 0, description: 'Parmi `enLigne`, ceux hébergés sur DataCloud.' }
        cercles:
          type: object
          description: |
            Les cercles de la Tech Tontine (contracts/cercles.yaml). Un cercle est actif tant qu'il n'est pas `termine`
            (`ouvert` ou `en_cours`). La ville d'un cercle n'est pas montrée : c'est un texte libre, et cette page est
            publique.
          required: [actifs, termines, toursLivres, nouveauxToursLivres, membres]
          properties:
            actifs: { type: integer, minimum: 0, description: 'Cercles `ouvert` ou `en_cours`.' }
            termines: { type: integer, minimum: 0, description: Cercles dont tous les tours sont livrés. }
            toursLivres: { type: integer, minimum: 0, description: 'Tours livrés depuis le début : autant de projets menés à terme en équipe.' }
            nouveauxToursLivres: { type: integer, minimum: 0, description: Tours livrés pendant la période. }
            membres:
              type: object
              description: |
                Les personnes qui font partie d'au moins un cercle, comptées une seule fois. Même règle que `inscrits` :
                un pays n'apparaît qu'avec **au moins 5 membres**, sinon il passe dans `autres`.
              required: [total, parPays, autres]
              properties:
                total: { type: integer, minimum: 0 }
                parPays:
                  type: array
                  items:
                    type: object
                    required: [pays, nombre]
                    properties:
                      pays: { $ref: './profils.yaml#/components/schemas/Pays' }
                      nombre: { type: integer, minimum: 5 }
                autres: { type: integer, minimum: 0, description: 'Membres d''un pays de moins de 5 membres, ou sans pays déclaré.' }
        moments:
          type: array
          description: |
            Un élément par service proposé au moins une fois pendant la période. Le taux d'acceptation se calcule côté
            front (`acceptes / proposes`). On ne le stocke pas, pour qu'il ne puisse jamais contredire les deux comptes.
          items: { $ref: '#/components/schemas/StatistiqueMoment' }

    StatistiqueMoment:
      type: object
      required: [service, proposes, acceptes]
      properties:
        service: { $ref: '#/components/schemas/ServiceSystalink' }
        proposes: { type: integer, minimum: 1 }
        acceptes: { type: integer, minimum: 0, description: Toujours inférieur ou égal à `proposes`. }

    PropositionSystalink:
      type: object
      description: |
        À référencer par les autres contrats (`$ref: './systalink.yaml#/components/schemas/PropositionSystalink'`)
        quand une réponse propose un service Systalink. Le texte affiché vient du front (clé de traduction par `service`).
      required: [momentId, service, lien]
      properties:
        momentId: { type: string, format: uuid, description: 'À envoyer à `accepterMomentSystalink` au clic.' }
        service: { $ref: '#/components/schemas/ServiceSystalink' }
        lien: { type: string, format: uri, description: 'Page Systalink à ouvrir, toujours en https.' }

    Tendances:
      type: object
      required: [periode, besoins, secteurs, services, competencesManquantes, pays]
      properties:
        periode: { $ref: '#/components/schemas/Periode' }
        besoins: { type: integer, minimum: 0, description: Besoins décrits sur la période. }
        secteurs:
          type: array
          items:
            type: object
            required: [secteur, besoins]
            properties:
              secteur: { type: string, description: '`autres` regroupe les secteurs de moins de 5 besoins.' }
              besoins: { type: integer, minimum: 0 }
        services:
          type: array
          description: Les services Systalink adaptés, et combien de fois.
          items:
            type: object
            required: [service, suggestions]
            properties:
              service: { type: string }
              suggestions: { type: integer, minimum: 0 }
        competencesManquantes:
          type: array
          maxItems: 10
          description: Les compétences demandées par les besoins, et combien de profils publiés les ont. Ce qui manque sur le continent.
          items:
            type: object
            required: [competence, demandes, profils]
            properties:
              competence: { $ref: './projets.yaml#/components/schemas/Competence' }
              demandes: { type: integer, minimum: 0 }
              profils: { type: integer, minimum: 0 }
        pays:
          type: array
          items:
            type: object
            required: [pays, besoins]
            properties:
              pays: { type: string, description: 'Code ISO, ou `autres`.' }
              besoins: { type: integer, minimum: 0 }

    StatutClient:
      type: string
      enum: [nouveau, contacte, client, sans_suite]

    ClientSuivi:
      type: object
      required: [demandeId, creeLe, resume, services, developpeursNecessaires, contact, statut]
      properties:
        demandeId: { type: string, format: uuid }
        creeLe: { type: string, format: date-time }
        resume: { type: string, description: 'Le besoin reformulé (`orientation.resume`), pas le texte d''origine.' }
        secteur: { type: [string, 'null'] }
        ville: { type: [string, 'null'] }
        pays: { type: [string, 'null'] }
        services: { type: array, items: { type: string }, description: Identifiants du catalogue. }
        developpeursNecessaires: { type: boolean }
        contact:
          type: object
          required: [nom, email]
          properties:
            nom: { type: string }
            email: { type: [string, 'null'], format: email, description: '`null` si la personne s''est connectée par GitHub sans e-mail connu.' }
        statut: { $ref: '#/components/schemas/StatutClient' }

openapi: 3.1.0
info:
  title: Jamii · Cercles (Tech Tontine)
  version: 0.3.0
  summary: Un cercle de 4 à 6 développeurs construit, à tour de rôle, le projet de chacun.
  description: |
    Responsable : @sowibrr (bloc #17). Règles communes : docs/api-conventions.md. Plan : docs/priorites.md, demande #98.

    **Le principe** : un **tour est un projet qui existe déjà** (`projets.yaml`). Le cercle n'ajoute qu'une liste de
    membres et un ordre de passage. L'équipe, les tâches, les jalons, les avis, la mise en ligne et la vitrine d'un tour
    sont ceux du projet : on les lit et on les modifie avec les routes de `projets.yaml`, à partir du `projetId` du tour.

    **Le déroulement** :
    1. Quelqu'un crée un cercle (`taille` de 4 à 6) et en devient le **créateur** et le premier membre.
    2. Les autres le rejoignent (`ouvert`). Chacun dépose son **idée** (titre et description).
    3. Quand le cercle est complet et que chacun a déposé son idée, le créateur **tire l'ordre au sort**, une seule fois.
       Le cercle passe à `en_cours` et le projet du tour 1 est créé, avec comme porteur le membre du rang 1, tous les
       membres dans l'équipe, et son idée comme titre et description.
    4. Le tour avance. Quand l'équipe a fini, on **livre** le tour : le suivant s'ouvre et son projet est créé. Après le
       dernier tour, le cercle passe à `termine`.

    **Le tirage** est fait par le serveur, avec un générateur aléatoire cryptographique (`SecureRandom`), jamais par le
    navigateur. Il est **enregistré** : `tirage.effectueLe` et `tirage.parId` disent quand et par qui, et l'ordre ne
    change plus jamais.

    **Droits** : tout utilisateur connecté voit un cercle (nom, membres, tours). Seuls les membres du cercle voient
    les **idées** des autres. Seul le créateur tire au sort. Le tour peut être livré par le membre à qui il appartient
    ou par le créateur.

    **CSRF** : toute requête POST, PUT, PATCH ou DELETE envoie l'en-tête `X-XSRF-TOKEN` (socle.yaml, schéma `csrf`).

    **Codes d'erreur métier** (champ `code` de `Erreur`, réponse 409) : `cercle_complet`, `deja_membre`,
    `tirage_deja_fait`, `cercle_incomplet`, `idees_manquantes`, `tour_non_en_cours`, `cercle_termine`,
    `point_deja_fait`, `pas_un_coup_de_main`.

    **Le salon du cercle** (v0.2, #157) : un fil privé aux membres (`403 pas_membre` pour les autres). On y écrit
    (`texte`), on y fait son **point du jour** (`point` : fait, prévu, bloqué ; un par jour UTC), on y demande un
    **coup de main** (`coup_de_main`, qui reste en haut tant qu'il n'est pas résolu) et on y lance un **appel**. Jamii
    y écrit seul les étapes du cercle (v0.3 : et on y consigne les **décisions** de l'équipe, `decision`, relues à part). Le
    **chef de projet** est le membre dont c'est le tour (avant le tirage et après le dernier tour, le créateur) : lui seul
    consigne les décisions (`403 pas_chef_de_projet`) et tient le calendrier du tour (les jalons du projet, `projets.yaml`).
    Jamii (`evenement` : création, arrivée d'un membre, tirage, tour ouvert ou livré, fin).

    **Dépôt de code** : chaque tour peut avoir un dépôt Git (`depot`), sur le Gitea de Jamii ou sur GitHub selon la
    configuration du serveur (`DEPOT_CODE`). `depot` vaut `null` tant qu'il n'existe pas : le front n'affiche alors rien.
servers:
  - url: http://localhost:8080

security:
  - session: []

tags:
  - { name: cercles, description: 'Créer, trouver et rejoindre un cercle.' }
  - { name: tirage, description: 'Déposer son idée, tirer l''ordre au sort.' }
  - { name: tours, description: Faire avancer les tours. }
  - { name: salon, description: 'Le salon privé du cercle : messages, points du jour, coups de main, appels.' }

paths:
  /api/cercles:
    get:
      tags: [cercles]
      operationId: listerCercles
      summary: Mes cercles, ou les cercles qui accueillent encore des membres (les plus récents d'abord)
      parameters:
        - $ref: './socle.yaml#/components/parameters/Curseur'
        - $ref: './socle.yaml#/components/parameters/Limite'
        - name: portee
          in: query
          description: '`mes` : les cercles dont je suis membre. `ouverts` : ceux qui ont encore de la place et pas encore de tirage (par défaut).'
          schema: { type: string, enum: [mes, ouverts], default: ouverts }
      responses:
        '200':
          description: Une page de cercles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './socle.yaml#/components/schemas/Page'
                  - properties: { elements: { type: array, items: { $ref: '#/components/schemas/CercleResume' } } }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
    post:
      tags: [cercles]
      operationId: creerCercle
      summary: Créer un cercle (j'en deviens le créateur et le premier membre)
      description: Limité à 5 cercles créés par jour et par personne.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreationCercle' }
      responses:
        '201':
          description: Cercle créé, au statut `ouvert`.
          headers: { Location: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cercle' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/cercles/{cercleId}:
    parameters:
      - $ref: '#/components/parameters/CercleId'
    get:
      tags: [cercles]
      operationId: lireCercle
      summary: Le cercle, ses membres, l'ordre de passage, le tour en cours et le projet de chaque tour
      responses:
        '200':
          description: Le cercle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cercle' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/cercles/{cercleId}/membres:
    parameters:
      - $ref: '#/components/parameters/CercleId'
    post:
      tags: [cercles]
      operationId: rejoindreCercle
      summary: Rejoindre un cercle
      description: |
        Sans corps. Possible tant que le cercle est `ouvert` et pas complet.
        `409 cercle_complet` si la dernière place vient d'être prise, `409 deja_membre`, ou `409 tirage_deja_fait`
        si l'ordre est déjà tiré (le cercle est alors fermé aux nouveaux membres).
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Tu es membre. Le cercle mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cercle' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/cercles/{cercleId}/membres/moi/idee:
    parameters:
      - $ref: '#/components/parameters/CercleId'
    put:
      tags: [tirage]
      operationId: deposerIdee
      summary: Déposer (ou remplacer) mon idée pour ce cercle
      description: |
        Membres seulement. L'idée devient le titre et la description du projet de mon tour. Elle se remplace tant que
        le tirage n'est pas fait ; après, `409 tirage_deja_fait`.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepotIdee' }
      responses:
        '200':
          description: Idée enregistrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembreCercle' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: Tu n'es pas membre de ce cercle., $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/cercles/{cercleId}/tirage:
    parameters:
      - $ref: '#/components/parameters/CercleId'
    post:
      tags: [tirage]
      operationId: tirerOrdre
      summary: Tirer l'ordre de passage au sort (n'importe quel membre, une seule fois)
      description: |
        Sans corps. Le serveur mélange les membres avec `SecureRandom`, enregistre l'ordre et le moment du tirage, puis
        crée le projet du tour 1. Conditions, dans cet ordre :
        - `403` si tu n'es pas membre du cercle (#157 : n'importe quel membre peut lancer le tirage, puisque c'est le
          serveur qui tire au hasard ; `tirage.parId` dit qui l'a lancé) ;
        - `409 tirage_deja_fait` si l'ordre est déjà tiré (rien ne change) ;
        - `409 cercle_incomplet` s'il manque des membres (`taille` n'est pas atteinte) ;
        - `409 idees_manquantes` si un membre n'a pas déposé d'idée.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Ordre tiré. Le cercle est `en_cours`, le tour 1 a son projet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cercle' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/cercles/{cercleId}/tours/{numero}/livrer:
    parameters:
      - $ref: '#/components/parameters/CercleId'
      - name: numero
        in: path
        required: true
        description: Le numéro du tour, à partir de 1. Ce doit être le tour en cours.
        schema: { type: integer, minimum: 1, maximum: 6 }
    post:
      tags: [tours]
      operationId: livrerTour
      summary: Livrer le tour en cours (ce qui ouvre le suivant)
      description: |
        Sans corps. Le tour passe à `livre`, le suivant à `en_cours` et son projet est créé. Après le dernier tour, le
        cercle passe à `termine`. Réservé au membre à qui appartient le tour, ou au créateur (`403` sinon).
        `409 tour_non_en_cours` si ce n'est pas le tour en cours (déjà livré, ou pas encore ouvert), et
        `409 cercle_termine` si tout est déjà livré. Rejouer la même requête ne livre jamais deux tours : la
        seconde répond `409`.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Tour livré. Le cercle mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cercle' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/cercles/{cercleId}/tours/{numero}/activite:
    parameters:
      - $ref: '#/components/parameters/CercleId'
      - name: numero
        in: path
        required: true
        description: Le numéro du tour, à partir de 1.
        schema: { type: integer, minimum: 1, maximum: 6 }
    get:
      tags: [tours]
      operationId: activiteDuTour
      summary: Ce qui se passe dans le dépôt du tour (derniers commits et demandes de fusion)
      description: |
        La collaboration se voit **dans Jamii** : l'API lit le dépôt du tour chez son fournisseur (GitHub aujourd'hui,
        Gitea demain, `DEPOT_CODE`) et le résume. Lecture seule : on code, on pousse et on fusionne chez le fournisseur.

        Toujours `200` quand le tour existe, avec un `etat` :
        - `aucun_depot` : le tour n'a pas (encore) de dépôt ;
        - `indisponible` : le fournisseur ne répond pas ou refuse. Les listes sont vides, le lien du dépôt reste utilisable ;
        - `disponible` : les listes sont remplies.

        Gardée **1 minute** en mémoire par dépôt : toute une salle qui regarde le même tour ne fait qu'un appel au
        fournisseur par minute. Visible par tout utilisateur connecté si les dépôts sont publics ; réservée aux membres du
        cercle (`403 pas_membre`) si les dépôts sont privés (`GITHUB_DEPOTS_PRIVES=true`).
      security:
        - session: []
      responses:
        '200':
          description: L'activité du dépôt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiviteDepot' }
              examples:
                demo:
                  value:
                    etat: disponible
                    depot: { fournisseur: github, url: 'https://github.com/jamii-cercles/cercle-de-dakar-tour-2-3f2a9c1e', cloneUrl: 'https://github.com/jamii-cercles/cercle-de-dakar-tour-2-3f2a9c1e.git' }
                    luLe: '2026-11-14T21:00:00Z'
                    commits:
                      - { sha: 9fceb02d0ae598e95dc970b74767f19372d61af8, message: 'Écran de caisse hors ligne', auteur: { login: kofi-m, avatarUrl: 'https://avatars.githubusercontent.com/u/1' }, date: '2026-11-14T20:41:00Z', url: 'https://github.com/jamii-cercles/cercle-de-dakar-tour-2-3f2a9c1e/commit/9fceb02' }
                    demandesDeFusion:
                      - { numero: 3, titre: 'Synchronisation au retour du réseau', etat: ouverte, auteur: { login: awa-d, avatarUrl: 'https://avatars.githubusercontent.com/u/2' }, misAJourLe: '2026-11-14T20:12:00Z', url: 'https://github.com/jamii-cercles/cercle-de-dakar-tour-2-3f2a9c1e/pull/3' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/cercles/{cercleId}/salon:
    parameters:
      - $ref: '#/components/parameters/CercleId'
    get:
      tags: [salon]
      operationId: lireSalonCercle
      summary: Le salon du cercle (membres seulement)
      description: |
        Sans `apres` : les `limite` derniers messages. Avec `apres` (une `version`) : ceux arrivés ou changés depuis, pour relire le
        salon toutes les quelques secondes. Toujours du plus ancien au plus récent. Renvoie aussi, à chaque fois, les
        coups de main ouverts, qui a fait son point aujourd'hui (jour UTC) et l'appel en cours.
      parameters:
        - { name: apres, in: query, schema: { type: integer, minimum: 0, format: int64 } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Le salon.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalonCercle' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/cercles/{cercleId}/salon/messages:
    parameters:
      - $ref: '#/components/parameters/CercleId'
    post:
      tags: [salon]
      operationId: ecrireSalonCercle
      summary: Écrire, faire son point du jour ou demander un coup de main (membres)
      description: Au plus 20 messages par minute et par personne (`429`). Un seul point par personne et par jour UTC (`409 point_deja_fait`).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NouveauMessageCercle' }
      responses:
        '201':
          description: Envoyé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageCercle' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre`, ou `pas_chef_de_projet` pour une `decision`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { description: '`point_deja_fait`.', $ref: './socle.yaml#/components/responses/Conflit' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/cercles/{cercleId}/salon/messages/{messageId}/resolu:
    parameters:
      - $ref: '#/components/parameters/CercleId'
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [salon]
      operationId: resoudreCoupDeMain
      summary: Marquer un coup de main résolu (n'importe quel membre)
      description: Idempotent. Le premier qui l'a résolu reste celui qu'on affiche.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: Le coup de main, résolu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageCercle' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { description: '`pas_un_coup_de_main`.', $ref: './socle.yaml#/components/responses/Conflit' }

  /api/cercles/{cercleId}/salon/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/CercleId'
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [salon]
      operationId: modifierMessageCercle
      summary: Corriger son message texte (15 minutes après l'envoi au plus)
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [texte]
              properties:
                texte: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Le message corrigé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageCercle' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { description: '`non_modifiable`, `delai_depasse`, `message_supprime`.', $ref: './socle.yaml#/components/responses/Conflit' }
    delete:
      tags: [salon]
      operationId: supprimerMessageCercle
      summary: Supprimer son message pour tout le monde
      description: Idempotent. Le texte, les fichiers et les réactions sont effacés ; la place reste (« Ce message a été supprimé »).
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: Supprimé. }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre`, `interdit` (le message d''un autre).', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/cercles/{cercleId}/salon/messages/{messageId}/reactions:
    parameters:
      - $ref: '#/components/parameters/CercleId'
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [salon]
      operationId: reagirMessageCercle
      summary: Ajouter ou retirer ma réaction (un emoji, 10 au plus par personne)
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [emoji, active]
              properties:
                emoji: { type: string, maxLength: 32 }
                active: { type: boolean }
      responses:
        '200':
          description: Le message, avec ses réactions à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageCercle' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { description: '`trop_de_reactions`, `message_supprime`.', $ref: './socle.yaml#/components/responses/Conflit' }

  /api/cercles/{cercleId}/salon/appel:
    parameters:
      - $ref: '#/components/parameters/CercleId'
    post:
      tags: [salon]
      operationId: lancerAppelCercle
      summary: Lancer l'appel du cercle, ou rejoindre celui qui est en cours (membres)
      description: |
        Un seul appel à la fois : s'il y en a un, `200` avec celui-ci. Sinon un appel neuf est créé (`201`), et un
        message `appel` l'annonce dans le salon. L'appel se passe dans Jamii, en WebRTC (#157) : on y entre ensuite par
        `POST …/appel/presence`. Il se termine quand le dernier présent part, ou une heure après son lancement. Au plus
        10 appels lancés par heure et par personne (`429`).
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: L'appel déjà en cours.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppelCercle' }
        '201':
          description: Appel lancé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppelCercle' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }
    delete:
      tags: [salon]
      operationId: terminerAppelCercle
      summary: Terminer l'appel en cours (celui qui l'a lancé, ou le créateur du cercle)
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: Terminé. }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre` ou `pas_lanceur`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { description: Pas d'appel en cours., $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/cercles/{cercleId}/salon/appel/presence:
    parameters:
      - $ref: '#/components/parameters/CercleId'
    post:
      tags: [salon]
      operationId: presenceAppelCercle
      summary: Je suis dans l'appel du cercle (toutes les 1,5 s)
      description: |
        L'appel du cercle en WebRTC (#157) : au plus 6 membres, chacun relié directement à chacun (un maillage). Le son
        et l'image ne passent jamais par l'API. Ce signe de vie renvoie qui est là, et les offres ou réponses SDP qui
        m'attendent : lues une seule fois, puis effacées. Pour chaque paire, c'est le dernier arrivé (`arriveLe`, puis
        l'identifiant) qui envoie l'offre. Sans signe de vie pendant 12 s, on a quitté l'appel. Jamais en cache.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: La salle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalleAppelCercle' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { description: '`pas_d_appel` : aucun appel en cours.', $ref: './socle.yaml#/components/responses/Introuvable' }
    delete:
      tags: [salon]
      operationId: quitterAppelCercle
      summary: Je quitte l'appel ; le dernier à partir le termine
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: Parti (sans effet si l'appel est déjà fini). }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/cercles/{cercleId}/salon/appel/signaux:
    parameters:
      - $ref: '#/components/parameters/CercleId'
    post:
      tags: [salon]
      operationId: signalAppelCercle
      summary: Une offre ou une réponse SDP pour un autre présent
      description: |
        Les deux personnes doivent être dans l'appel (`409 pas_dans_l_appel`). Le SDP complet, candidats ICE inclus,
        commence par `v=0` et fait au plus 30 000 caractères. Au plus 6 signaux en attente d'une personne à une autre
        (`429`). Un signal non lu disparaît au bout d'une minute.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [a, type, sdp]
              properties:
                a: { type: string, format: uuid }
                type: { type: string, enum: [offre, reponse] }
                sdp: { type: string, maxLength: 30000 }
      responses:
        '204': { description: Déposé. }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_membre`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

components:
  securitySchemes:
    session: { $ref: './socle.yaml#/components/securitySchemes/session' }
    csrf: { $ref: './socle.yaml#/components/securitySchemes/csrf' }

  parameters:
    CercleId:
      name: cercleId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    StatutCercle:
      type: string
      description: '`ouvert` : on rejoint et on dépose son idée. `en_cours` : l''ordre est tiré, les tours se suivent. `termine` : tous les tours sont livrés.'
      enum: [ouvert, en_cours, termine]

    StatutTour:
      type: string
      enum: [a_venir, en_cours, livre]

    CreationCercle:
      type: object
      additionalProperties: false
      required: [nom, taille]
      properties:
        nom: { type: string, minLength: 3, maxLength: 80, examples: ['Cercle de Dakar'] }
        ville:
          type: string
          minLength: 2
          maxLength: 80
          deprecated: true
          description: "Facultative depuis le 15/11 : le formulaire ne la demande plus (un cercle travaille en ligne). Encore acceptée pour les anciens clients."
        taille: { type: integer, minimum: 4, maximum: 6, description: 'Nombre de membres, créateur compris.' }
        profils:
          type: array
          maxItems: 5
          uniqueItems: true
          description: 'Les profils dont le cercle a besoin. Facultatif : vide, rien de précisé.'
          items: { $ref: '#/components/schemas/ProfilRecherche' }

    ProfilRecherche:
      type: string
      enum: [front, back, mobile, design, data, ia, devops, securite, produit, test]
      description: 'Un profil recherché : développement front, back ou mobile, design, données, IA, mise en ligne (devops), sécurité, produit (chef de projet), test.'

    Idee:
      type: object
      additionalProperties: false
      required: [titre, description]
      properties:
        titre: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 5000, description: 'Texte brut, affiché échappé.' }
        cahierCharges: { oneOf: [{ $ref: './fichiers.yaml#/components/schemas/PieceJointe' }, { type: 'null' }] }
        backlog: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/TacheBacklog' } }

    TacheBacklog:
      type: object
      additionalProperties: false
      required: [titre]
      properties:
        titre: { type: string, minLength: 3, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 2000 }
        priorite: { type: string, enum: [haute, normale, basse], default: normale }
        echeance: { type: [string, 'null'], format: date }

    DepotIdee:
      type: object
      additionalProperties: false
      required: [titre, description]
      properties:
        titre: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        cahierChargesId: { type: [string, 'null'], format: uuid, description: 'Document téléversé avec le cercleId de ce cercle.' }
        backlog: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/TacheBacklog' }, description: 'Remplace le backlog préparé. Les tâches seront créées une seule fois à l’ouverture du tour.' }

    CercleResume:
      type: object
      required: [id, nom, ville, taille, statut, nombreMembres, createur, creeLe, profilsRecherches]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string }
        ville: { type: [string, 'null'], description: 'null pour les cercles créés sans ville.' }
        taille: { type: integer, minimum: 4, maximum: 6 }
        statut: { $ref: '#/components/schemas/StatutCercle' }
        nombreMembres: { type: integer, minimum: 1, maximum: 6 }
        createur: { $ref: './projets.yaml#/components/schemas/PersonneResume' }
        creeLe: { type: string, format: date-time }
        profilsRecherches:
          type: array
          description: 'Les profils dont le cercle a besoin, choisis à sa création. Vide : rien de précisé.'
          items: { $ref: '#/components/schemas/ProfilRecherche' }

    Cercle:
      allOf:
        - $ref: '#/components/schemas/CercleResume'
        - type: object
          required: [membres, tours, tourEnCours, tirage, moi]
          properties:
            membres:
              type: array
              description: Dans l'ordre de passage une fois le tirage fait, sinon dans l'ordre d'arrivée.
              items: { $ref: '#/components/schemas/MembreCercle' }
            tours:
              type: array
              description: Vide avant le tirage. Ensuite, un tour par membre, dans l'ordre.
              items: { $ref: '#/components/schemas/Tour' }
            tourEnCours: { type: [integer, 'null'], minimum: 1, description: '`null` avant le tirage et après le dernier tour.' }
            tirage:
              oneOf:
                - $ref: '#/components/schemas/Tirage'
                - type: 'null'
            moi:
              type: object
              description: Ma place dans ce cercle, pour afficher les bons boutons (les droits restent vérifiés par le serveur).
              required: [estCreateur, estMembre]
              properties:
                estCreateur: { type: boolean }
                estMembre: { type: boolean }

    MembreCercle:
      type: object
      required: [personne, rang, aDeposeIdee, rejointLe]
      properties:
        personne: { $ref: './projets.yaml#/components/schemas/PersonneResume' }
        rang: { type: [integer, 'null'], minimum: 1, maximum: 6, description: Ordre de passage. `null` avant le tirage. }
        aDeposeIdee: { type: boolean }
        idee:
          description: Visible seulement pour les membres du cercle. Absente pour les autres.
          oneOf:
            - $ref: '#/components/schemas/Idee'
            - type: 'null'
        rejointLe: { type: string, format: date-time }

    Tour:
      type: object
      required: [numero, statut, beneficiaire, projetId, depot, livreLe]
      properties:
        numero: { type: integer, minimum: 1, maximum: 6 }
        statut: { $ref: '#/components/schemas/StatutTour' }
        beneficiaire:
          description: Le membre dont le projet est construit pendant ce tour (le porteur du projet).
          $ref: './projets.yaml#/components/schemas/PersonneResume'
        projetId:
          type: [string, 'null']
          format: uuid
          description: Le projet du tour (`projets.yaml`). `null` tant que le tour est `a_venir`.
        depot:
          description: Le dépôt Git du tour. `null` tant qu'il n'existe pas.
          oneOf:
            - $ref: '#/components/schemas/Depot'
            - type: 'null'
        livreLe: { type: [string, 'null'], format: date-time }

    Depot:
      type: object
      required: [fournisseur, url, cloneUrl]
      properties:
        fournisseur: { type: string, enum: [gitea, github] }
        url: { type: string, format: uri, pattern: '^https://', description: La page du dépôt. }
        cloneUrl: { type: string, format: uri, pattern: '^https://', description: L'adresse à cloner. }

    ActiviteDepot:
      type: object
      required: [etat, depot, luLe, commits, demandesDeFusion]
      properties:
        etat: { type: string, enum: [disponible, indisponible, aucun_depot] }
        depot:
          oneOf:
            - $ref: '#/components/schemas/Depot'
            - type: 'null'
        luLe: { type: string, format: date-time, description: Moment de la lecture chez le fournisseur (jusqu'à 1 minute). }
        commits:
          type: array
          maxItems: 10
          description: Les 10 derniers commits de la branche par défaut, du plus récent au plus ancien.
          items: { $ref: '#/components/schemas/Commit' }
        demandesDeFusion:
          type: array
          maxItems: 10
          description: Les 10 demandes de fusion (pull requests) mises à jour le plus récemment, ouvertes ou non.
          items: { $ref: '#/components/schemas/DemandeDeFusion' }

    AuteurDepot:
      type: object
      description: Le compte chez le fournisseur. `null` quand le commit n'est relié à aucun compte.
      required: [login, avatarUrl]
      properties:
        login: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }

    Commit:
      type: object
      required: [sha, message, auteur, date, url]
      properties:
        sha: { type: string, minLength: 7, maxLength: 64 }
        message: { type: string, maxLength: 200, description: 'La première ligne seulement, coupée à 200 caractères.' }
        auteur:
          oneOf:
            - $ref: '#/components/schemas/AuteurDepot'
            - type: 'null'
        date: { type: string, format: date-time }
        url: { type: string, format: uri, pattern: '^https://' }

    DemandeDeFusion:
      type: object
      required: [numero, titre, etat, auteur, misAJourLe, url]
      properties:
        numero: { type: integer, minimum: 1 }
        titre: { type: string, maxLength: 200 }
        etat: { type: string, enum: [ouverte, fusionnee, fermee] }
        auteur:
          oneOf:
            - $ref: '#/components/schemas/AuteurDepot'
            - type: 'null'
        misAJourLe: { type: string, format: date-time }
        url: { type: string, format: uri, pattern: '^https://' }

    Tirage:
      type: object
      description: Quand et par qui l'ordre a été tiré. Enregistré, jamais modifié.
      required: [effectueLe, parId]
      properties:
        effectueLe: { type: string, format: date-time }
        parId: { type: string, format: uuid, description: 'Le membre qui a lancé le tirage (le créateur, pour les cercles tirés avant #157).' }

    SalonCercle:
      type: object
      required: [elements, coupsDeMain, decisions, pointsDuJour, appel]
      properties:
        elements: { type: array, items: { $ref: '#/components/schemas/MessageCercle' } }
        coupsDeMain: { type: array, maxItems: 10, description: 'Les coups de main pas encore résolus, du plus ancien au plus récent.', items: { $ref: '#/components/schemas/MessageCercle' } }
        decisions: { type: array, maxItems: 30, description: 'Les dernières décisions, de la plus récente à la plus ancienne (v0.3).', items: { $ref: '#/components/schemas/MessageCercle' } }
        pointsDuJour: { type: array, description: 'Les membres qui ont fait leur point aujourd''hui (jour UTC).', items: { type: string, format: uuid } }
        appel: { oneOf: [{ $ref: '#/components/schemas/AppelCercle' }, { type: 'null' }] }

    TypeMessageCercle:
      type: string
      enum: [texte, point, coup_de_main, evenement, appel, decision]

    MessageCercle:
      type: object
      description: Les champs propres à un type (`point`, `evenement`, `coupDeMain`, `appel`) valent `null` pour les autres.
      required: [id, numero, type, auteur, texte, point, evenement, coupDeMain, appel, envoyeLe, piecesJointes, version, reponseA, modifieLe, supprime, reactions]
      properties:
        id: { type: string, format: uuid }
        numero: { type: integer, format: int64, description: 'Croissant : l''ordre du salon.' }
        version: { type: integer, format: int64, description: 'Avance à chaque changement du message (écrit, modifié, supprimé, réaction, résolu). Sert de curseur (`apres`).' }
        type: { $ref: '#/components/schemas/TypeMessageCercle' }
        auteur:
          description: '`null` pour un événement (écrit par Jamii).'
          oneOf: [{ $ref: './projets.yaml#/components/schemas/PersonneResume' }, { type: 'null' }]
        texte: { type: [string, 'null'], maxLength: 2000 }
        point: { oneOf: [{ $ref: '#/components/schemas/PointDuJour' }, { type: 'null' }] }
        evenement: { oneOf: [{ $ref: '#/components/schemas/EvenementCercle' }, { type: 'null' }] }
        coupDeMain:
          oneOf:
            - type: object
              required: [resoluLe, resoluPar]
              properties:
                resoluLe: { type: [string, 'null'], format: date-time, description: '`null` tant que personne ne l''a résolu.' }
                resoluPar: { oneOf: [{ $ref: './projets.yaml#/components/schemas/PersonneResume' }, { type: 'null' }] }
            - type: 'null'
        appel:
          oneOf:
            - type: object
              required: [id, enCours]
              properties:
                id: { type: string, format: uuid }
                enCours: { type: boolean }
            - type: 'null'
        envoyeLe: { type: string, format: date-time }
        piecesJointes: { type: array, maxItems: 6, items: { $ref: './fichiers.yaml#/components/schemas/PieceJointe' } }
        reponseA:
          description: 'Le message auquel celui-ci répond (#157), ou `null`.'
          oneOf:
            - type: object
              required: [id, auteur, texte, supprime]
              properties:
                id: { type: string, format: uuid }
                auteur: { oneOf: [{ $ref: './projets.yaml#/components/schemas/PersonneResume' }, { type: 'null' }] }
                texte: { type: string, maxLength: 140, description: 'Son début. Vide s''il a été supprimé.' }
                supprime: { type: boolean }
            - type: 'null'
        modifieLe: { type: [string, 'null'], format: date-time, description: 'Corrigé par son auteur (15 minutes après l''envoi au plus).' }
        supprime: { type: boolean, description: 'Supprimé pour tout le monde : texte, fichiers et réactions effacés, la place reste.' }
        reactions: { type: array, items: { $ref: './reseau.yaml#/components/schemas/Reaction' } }

    PointDuJour:
      type: object
      additionalProperties: false
      required: [fait, prevu]
      properties:
        fait: { type: string, minLength: 1, maxLength: 500, description: "Ce que j'ai fait depuis mon dernier point." }
        prevu: { type: string, minLength: 1, maxLength: 500, description: Ce que je fais ensuite. }
        bloque: { type: [string, 'null'], maxLength: 500, description: "Ce qui me bloque, s'il y a quelque chose." }

    EvenementCercle:
      type: object
      required: [code, tour, personne]
      properties:
        code: { type: string, enum: [cercle_cree, membre_rejoint, tirage, tour_ouvert, tour_livre, cercle_termine] }
        tour: { type: [integer, 'null'], minimum: 1, maximum: 6 }
        personne:
          description: 'De qui parle l''événement : le créateur, le nouveau membre, qui a tiré, le bénéficiaire du tour.'
          oneOf: [{ $ref: './projets.yaml#/components/schemas/PersonneResume' }, { type: 'null' }]

    NouveauMessageCercle:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [texte, point, coup_de_main, decision] }
        texte: { type: string, minLength: 1, maxLength: 2000, description: 'Pour `texte`, `coup_de_main` et `decision`.' }
        point: { $ref: '#/components/schemas/PointDuJour' }
        pieces:
          $ref: './fichiers.yaml#/components/schemas/Pieces'
          description: 'Envoyés avec le `cercleId` de ce cercle (réservés à ses membres, #157), ou sans destination. Ceux d''un autre cercle ou d''une conversation : 400 `piece_inconnue`.'
        reponseA: { type: string, format: uuid, description: 'Répondre à un message du salon (pas un événement).' }

    AppelCercle:
      type: object
      required: [id, lancePar, lanceLe, url, presents]
      properties:
        id: { type: string, format: uuid }
        lancePar: { oneOf: [{ $ref: './projets.yaml#/components/schemas/PersonneResume' }, { type: 'null' }] }
        lanceLe: { type: string, format: date-time }
        url: { type: string, format: uri, description: 'L''ancienne salle Jitsi, gardée pour compatibilité : l''appel se passe désormais dans Jamii (WebRTC, #157).' }
        presents: { type: integer, minimum: 0, description: 'Combien de membres sont dans l''appel en ce moment.' }

    SalleAppelCercle:
      type: object
      required: [appelId, presents, signaux]
      properties:
        appelId: { type: string, format: uuid }
        presents:
          type: array
          description: Les présents, moi compris, du premier arrivé au dernier.
          items:
            type: object
            required: [personne, arriveLe]
            properties:
              personne: { $ref: './projets.yaml#/components/schemas/PersonneResume' }
              arriveLe: { type: string, format: date-time }
        signaux:
          type: array
          description: Les offres et réponses qui m'attendaient, dans l'ordre d'envoi. Effacées une fois lues.
          items:
            type: object
            required: [de, type, sdp]
            properties:
              de: { type: string, format: uuid }
              type: { type: string, enum: [offre, reponse] }
              sdp: { type: string }

openapi: 3.1.0
info:
  title: Jamii · Vitrine
  version: 0.1.0
  summary: Les projets nés sur Jamii et vraiment en ligne, avec « Hébergé sur Systalink » pour ceux sur DataCloud.
  description: |
    Responsable : @Amar233-ui (bloc #18). Règles communes : docs/api-conventions.md. Modèle : docs/modele-donnees.md
    (« la vitrine n'est pas une table »).

    **Qui y apparaît** : un projet dont au moins un déploiement est `en_ligne` **et a répondu lors d'une vérification
    de moins de 24 heures** (`verifieLe`). Un projet qui ne répond plus sort de la vitrine tout seul : on n'affiche
    jamais un lien mort.

    **Lecture publique** : la vitrine se lit sans connexion. Elle ne montre que ce que le projet montre déjà à tous
    (titre, accroche, lien public, nom et avatar des membres de l'équipe), jamais un e-mail.

    **Sources** : titre, accroche et équipe viennent du module `projets` (#17), le lien et l'hébergeur du module
    `deploiement` (#20). Le module `vitrine` ne lit pas leurs tables, il leur demande.

    **Sécurité côté front** : `url` vient d'un utilisateur. Le front l'ouvre dans un nouvel onglet avec
    `rel="noopener noreferrer nofollow ugc"`, et l'API ne renvoie que des adresses en `https`.
servers:
  - url: http://localhost:8080

tags:
  - { name: vitrine, description: 'Les projets en ligne nés sur Jamii (lecture publique).' }

paths:
  /api/vitrine:
    get:
      tags: [vitrine]
      operationId: listerVitrine
      summary: Les projets en ligne, les plus récemment mis en ligne d'abord
      security: []
      parameters:
        - $ref: './socle.yaml#/components/parameters/Curseur'
        - $ref: './socle.yaml#/components/parameters/Limite'
        - name: hebergeur
          in: query
          description: '`datacloud` : seulement les projets hébergés sur Systalink.'
          schema: { $ref: '#/components/schemas/Hebergeur' }
        - name: pays
          in: query
          description: 'Projets dont au moins un membre de l''équipe vient de ce pays (ISO 3166-1 alpha-2).'
          schema: { $ref: './profils.yaml#/components/schemas/Pays' }
      responses:
        '200':
          description: Une page de projets en ligne.
          headers:
            Cache-Control:
              schema: { type: string, examples: ['public, max-age=60'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageVitrine' }
              examples:
                demo:
                  value:
                    curseurSuivant: null
                    elements:
                      - projetId: 3f0e6c1a-2b4d-4e8f-9a7c-1d2e3f4a5b6c
                        titre: Boutique en ligne pour une couturière de Thiès
                        accroche: Catalogue, commandes par WhatsApp et paiement à la livraison, pour une PME de 3 personnes.
                        origine: demande
                        url: https://couture-thies.example.com
                        hebergeur: datacloud
                        misEnLigneLe: '2026-11-12T16:20:00Z'
                        verifieLe: '2026-11-13T09:00:00Z'
                        paysEquipe: [SN, CI]
                        equipe:
                          - { id: 6f1c2a4e-8b7d-4c3e-9a10-2b5d7e9f0a11, nom: Awa Diop, avatarUrl: null }
                          - { id: 0b9e8d7c-6a5f-4e3d-8c2b-1a0f9e8d7c6b, nom: Koffi Yao, avatarUrl: null }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }

components:
  schemas:
    Hebergeur:
      type: string
      enum: [datacloud, autre]
      description: '`datacloud` : le front affiche « Hébergé sur Systalink ».'

    ProjetEnVitrine:
      type: object
      required: [projetId, titre, accroche, origine, url, hebergeur, misEnLigneLe, verifieLe, paysEquipe, equipe]
      properties:
        projetId: { type: string, format: uuid }
        titre: { type: string, maxLength: 120 }
        accroche:
          type: string
          maxLength: 280
          description: Le début de la description du projet, coupé proprement par l'API. Texte brut, jamais du HTML.
        origine:
          type: string
          enum: [idee, demande]
          description: '`demande` : le projet répond au besoin d''une PME.'
        url: { type: string, format: uri, pattern: '^https://', description: Adresse publique du projet. }
        hebergeur: { $ref: '#/components/schemas/Hebergeur' }
        misEnLigneLe: { type: string, format: date-time, description: Premier passage `en_ligne` du déploiement affiché. }
        verifieLe: { type: string, format: date-time, description: Dernière fois que l'adresse a répondu (moins de 24 h). }
        paysEquipe:
          type: array
          items: { $ref: './profils.yaml#/components/schemas/Pays' }
          description: Pays des membres de l'équipe, sans doublon.
        equipe:
          type: array
          minItems: 1
          items: { $ref: './projets.yaml#/components/schemas/PersonneResume' }
          description: Le porteur d'abord, puis les membres.

    PageVitrine:
      allOf:
        - $ref: './socle.yaml#/components/schemas/Page'
        - type: object
          properties:
            elements:
              type: array
              items: { $ref: '#/components/schemas/ProjetEnVitrine' }

openapi: 3.1.0
info:
  title: Jamii · Communautés et entraide
  version: 0.8.0
  summary: Communautés thématiques, questions-réponses entre membres, discussions, signalements.
  description: |
    Responsable : @rev22rse22 (module communautés, #155 ; repris d'@Amar233-ui le 14/11). Règles communes : docs/api-conventions.md. Modèle : docs/modele-donnees.md
    (tables `communaute`, `adhesion`, `publication`, `reponse`, `signalement`). Idées reprises de la proposition 0003.

    **Droits** : il faut être connecté pour tout. Lire est ouvert à tout utilisateur connecté. Publier et répondre
    demandent d'être **membre** de la communauté (rejoindre se fait en un clic). Les droits sont vérifiés par
    le serveur, à chaque route.

    **Entre membres, sans IA (v0.8)** : les questions reçoivent les réponses des membres, et seulement elles.
    L'**auteur de la question** accepte une réponse. Son auteur reçoit une preuve `reponse_acceptee` sur son profil
    (événement `ReponseAcceptee`, #19). L'assistant IA de Jamii (Ayo) n'intervient que dans les demandes et le profil.

    **Contenus** : texte brut. Le front l'affiche échappé (jamais `v-html`), donc aucun HTML ne s'exécute.

    **Salons (v0.2, #155)** : chaque communauté a des salons de discussion écrite (`general`, `entraide`, `projets`).
    Lire est ouvert à tout utilisateur connecté, écrire demande d'être membre. Le front relit les nouveaux messages
    **toutes les 3 secondes** avec `apres` (le `numero` du dernier message reçu) : pas de WebSocket, rien de plus à
    héberger derrière le proxy de DataCloud. Un membre **lance un appel** vocal et vidéo dans un salon (v0.7) : une salle
    neuve, annoncée dans le salon, donnée **aux membres seulement** (Jitsi pour la CADEV). Les messages d'un compte
    supprimé sont supprimés avec lui (une discussion en direct n'a pas besoin d'être relue comme une réponse).

    **CSRF** : toute requête POST ou DELETE envoie l'en-tête `X-XSRF-TOKEN` (socle.yaml, schéma `csrf`).

    **Codes d'erreur métier** (champ `code` de `Erreur`) : `pas_membre` (403), `pas_moderateur` (403), `salon_existe` (409), `salon_protege` (409), `pas_auteur_question` (403),
    `deja_acceptee` (409), `pas_une_question` (409), `propre_reponse` (409, accepter sa propre réponse :
    sinon on se donnerait une preuve sur son profil), `deja_signale` (409).
servers:
  - url: http://localhost:8080

security:
  - session: []

tags:
  - { name: communautes, description: 'Trouver, rejoindre et quitter une communauté.' }
  - { name: publications, description: 'Questions, discussions et « Montre ton projet ».' }
  - { name: reponses, description: 'Répondre et accepter une réponse.' }
  - { name: salons, description: 'Discuter en direct dans un salon, et rejoindre son appel.' }
  - { name: moderation, description: 'Signaler un contenu à un modérateur.' }

paths:
  /api/communautes:
    get:
      tags: [communautes]
      operationId: listerCommunautes
      summary: Les communautés, les plus actives cette semaine d'abord
      parameters:
        - $ref: './socle.yaml#/components/parameters/Curseur'
        - $ref: './socle.yaml#/components/parameters/Limite'
        - { name: membre, in: query, description: '`moi` : seulement celles que j''ai rejointes.', schema: { type: string, enum: [moi] } }
      responses:
        '200':
          description: Une page de communautés.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageCommunautes' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
    post:
      tags: [communautes]
      operationId: creerCommunaute
      summary: Créer une communauté (v0.4)
      description: |
        Tout membre connecté peut créer une communauté. Il en devient le **modérateur**, et elle démarre avec trois salons
        (`general`, `entraide`, `projets`). Le nom court (`slug`) est tiré du nom, rendu unique par le serveur.
        Limité à **3 communautés par jour et par personne** (`429` avec `Retry-After`), contre le spam.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NouvelleCommunaute' }
      responses:
        '201':
          description: Créée.
          headers:
            Location: { schema: { type: string, examples: ['/api/communautes/devs-du-sahel'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Communaute' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/communautes/{slug}:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [communautes]
      operationId: lireCommunaute
      summary: Une communauté
      responses:
        '200':
          description: La communauté.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Communaute' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/communautes/{slug}/couverture:
    parameters:
      - $ref: '#/components/parameters/Slug'
    put:
      tags: [communautes]
      operationId: changerCouverture
      summary: Changer la couverture, ou revenir au motif (modérateurs)
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChoixCouverture' }
      responses:
        '200':
          description: La communauté, avec sa nouvelle couverture.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Communaute' }
        '400': { description: '`validation` (`image_invalide`).', $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { description: '`pas_moderateur`.', $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/communautes/{slug}/adhesion:
    parameters:
      - $ref: '#/components/parameters/Slug'
    post:
      tags: [communautes]
      operationId: rejoindreCommunaute
      summary: Rejoindre la communauté
      description: Idempotent. Répond `204` aussi si je suis déjà membre.
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: Je suis membre. }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
    delete:
      tags: [communautes]
      operationId: quitterCommunaute
      summary: Quitter la communauté
      description: Idempotent. Mes publications restent, signées de mon nom.
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: Je ne suis plus membre. }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/communautes/{slug}/publications:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [publications]
      operationId: listerPublications
      summary: Les publications de la communauté, les plus récentes d'abord
      parameters:
        - $ref: './socle.yaml#/components/parameters/Curseur'
        - $ref: './socle.yaml#/components/parameters/Limite'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/TypePublication' } }
        - { name: sansReponseAcceptee, in: query, description: 'Seulement les questions encore ouvertes.', schema: { type: boolean } }
      responses:
        '200':
          description: Une page de publications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagePublications' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
    post:
      tags: [publications]
      operationId: publier
      summary: Publier une question, une discussion ou « Montre ton projet »
      description: |
        Réservé aux membres.
        Limité à 10 publications par heure et par personne, contre le spam.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NouvellePublication' }
      responses:
        '201':
          description: Publiée.
          headers:
            Location: { schema: { type: string, examples: ['/api/publications/5d2c…'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publication' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/communautes/{slug}/membres:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [communautes]
      operationId: listerMembres
      summary: Les membres de la communauté (v0.3)
      description: |
        Les modérateurs d'abord, puis les membres actifs ces 7 derniers jours (un message dans un salon, une
        publication ou une réponse), puis les autres, des plus récents aux plus anciens. Jamais l'e-mail.
      parameters:
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Les membres.
          content:
            application/json:
              schema:
                type: object
                required: [elements, total]
                properties:
                  total: { type: integer, minimum: 0 }
                  elements: { type: array, items: { $ref: '#/components/schemas/MembreCommunaute' } }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/communautes/{slug}/salons:
    parameters:
      - $ref: '#/components/parameters/Slug'
    get:
      tags: [salons]
      operationId: listerSalons
      summary: Les salons de la communauté, dans leur ordre
      responses:
        '200':
          description: Les salons.
          content:
            application/json:
              schema:
                type: object
                required: [elements]
                properties:
                  elements: { type: array, items: { $ref: '#/components/schemas/Salon' } }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
    post:
      tags: [salons]
      operationId: creerSalon
      summary: Créer un salon (modérateurs seulement, v0.4)
      description: |
        Le nom court du salon est tiré de son nom. Au plus 20 salons par communauté. Un autre membre reçoit `403`
        (`pas_moderateur`) ; un salon du même nom existe déjà : `409` (`salon_existe`).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NouveauSalon' }
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Salon' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/communautes/{slug}/salons/{salon}:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/SalonSlug'
    delete:
      tags: [salons]
      operationId: supprimerSalon
      summary: Supprimer un salon et tous ses messages (modérateurs seulement, v0.5)
      description: |
        Définitif : les messages du salon sont supprimés avec lui. `#général` ne se supprime pas (`409 salon_protege`) :
        c'est là qu'on arrive dans une communauté. Un autre membre reçoit `403` (`pas_moderateur`).
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: Supprimé. }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/communautes/{slug}/salons/{salon}/appel:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/SalonSlug'
    post:
      tags: [salons]
      operationId: lancerAppel
      summary: Lancer un appel dans le salon, ou rejoindre celui qui est en cours (membres, v0.7)
      description: |
        S'il n'y a pas d'appel en cours, en crée un, avec une salle neuve, et poste dans le salon un message qui l'annonce
        (`201`). S'il y en a un, le renvoie (`200`) : un seul appel à la fois par salon. Un appel se termine tout seul
        une heure après son lancement. Limité à 10 appels lancés par heure et par personne.
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: L'appel déjà en cours.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppelSalon' }
        '201':
          description: Appel lancé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppelSalon' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }
    delete:
      tags: [salons]
      operationId: terminerAppel
      summary: Terminer l'appel en cours (celui qui l'a lancé, ou un modérateur)
      security:
        - session: []
          csrf: []
      responses:
        '204': { description: Terminé. }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/communautes/{slug}/salons/{salon}/messages:
    parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/SalonSlug'
    get:
      tags: [salons]
      operationId: lireMessagesSalon
      summary: Les messages du salon, du plus ancien au plus récent
      description: |
        Sans `apres` : les `limite` derniers messages. Avec `apres` : seulement les messages arrivés depuis (c'est
        l'appel fait toutes les 3 secondes). La réponse n'est jamais mise en cache.
      parameters:
        - { name: apres, in: query, description: 'Le `numero` du dernier message déjà reçu.', schema: { type: integer, format: int64, minimum: 0 } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Les messages.
          content:
            application/json:
              schema:
                type: object
                required: [elements]
                properties:
                  elements: { type: array, items: { $ref: '#/components/schemas/MessageSalon' } }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
    post:
      tags: [salons]
      operationId: ecrireDansSalon
      summary: Écrire dans le salon (membres seulement)
      description: 'Limité à 20 messages par minute et par personne, contre le spam (`429` avec `Retry-After`).'
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NouveauMessageSalon' }
      responses:
        '201':
          description: Envoyé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageSalon' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/publications/{publicationId}:
    parameters:
      - $ref: '#/components/parameters/PublicationId'
    get:
      tags: [publications]
      operationId: lirePublication
      summary: Une publication et toutes ses réponses
      responses:
        '200':
          description: La publication.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publication' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }

  /api/publications/{publicationId}/reponses:
    parameters:
      - $ref: '#/components/parameters/PublicationId'
    post:
      tags: [reponses]
      operationId: repondre
      summary: Répondre à une publication
      description: Réservé aux membres de la communauté. Limité à 30 réponses par heure et par personne.
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NouvelleReponse' }
      responses:
        '201':
          description: Réponse publiée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reponse' }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

  /api/reponses/{reponseId}/accepter:
    parameters:
      - $ref: '#/components/parameters/ReponseId'
    post:
      tags: [reponses]
      operationId: accepterReponse
      summary: L'auteur de la question accepte une réponse
      description: |
        Une seule réponse acceptée par question (`409 deja_acceptee`). L'auteur de la réponse reçoit une preuve
        `reponse_acceptee` sur son profil. On n'accepte pas sa propre réponse (`409 propre_reponse`).
      security:
        - session: []
          csrf: []
      responses:
        '200':
          description: La question, avec sa réponse acceptée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Publication' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '403': { $ref: './socle.yaml#/components/responses/Interdit' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }

  /api/signalements:
    post:
      tags: [moderation]
      operationId: signaler
      summary: Signaler une publication ou une réponse à un modérateur
      description: |
        Le contenu reste visible jusqu'à la décision d'un modérateur (le traitement des signalements viendra après le
        15 novembre). Un même compte ne signale qu'une fois le même contenu (`409 deja_signale`).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NouveauSignalement' }
      responses:
        '202': { description: Signalement reçu. }
        '400': { $ref: './socle.yaml#/components/responses/Invalide' }
        '401': { $ref: './socle.yaml#/components/responses/NonConnecte' }
        '404': { $ref: './socle.yaml#/components/responses/Introuvable' }
        '409': { $ref: './socle.yaml#/components/responses/Conflit' }
        '429': { $ref: './socle.yaml#/components/responses/TropDeRequetes' }

components:
  securitySchemes:
    session: { $ref: './socle.yaml#/components/securitySchemes/session' }
    csrf: { $ref: './socle.yaml#/components/securitySchemes/csrf' }

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: Nom court de la communauté dans l'adresse (`flutter`, `fintech`, `antenne-dakar`).
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 60 }
    SalonSlug:
      name: salon
      in: path
      required: true
      description: Nom court du salon (`general`, `entraide`, `projets`).
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 40 }
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReponseId:
      name: reponseId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Communaute:
      type: object
      required: [id, slug, nom, description, theme, pays, nombreMembres, questionsOuvertes, membre, moderateur, couverture]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        nom: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        theme: { type: string, maxLength: 40, examples: [flutter, fintech, ia, antenne] }
        pays:
          oneOf: [{ $ref: './profils.yaml#/components/schemas/Pays' }, { type: 'null' }]
          description: Renseigné pour une **antenne locale** (Dakar, Abidjan, Nairobi…), vide sinon.
        nombreMembres: { type: integer, minimum: 0 }
        questionsOuvertes: { type: integer, minimum: 0, description: Questions sans réponse acceptée. }
        membre: { type: boolean, description: 'Suis-je membre ? (pour afficher « Rejoindre » ou « Quitter »)' }
        moderateur: { type: boolean, description: 'Suis-je modérateur ? (pour afficher « Créer un salon »). Vérifié par le serveur.' }
        couverture:
          type: [string, 'null']
          description: 'L''image de couverture (`/api/fichiers/{id}`, à lire avec la session). Vide : la communauté garde son motif.'

    PageCommunautes:
      allOf:
        - $ref: './socle.yaml#/components/schemas/Page'
        - type: object
          properties:
            elements: { type: array, items: { $ref: '#/components/schemas/Communaute' } }

    TypePublication:
      type: string
      enum: [question, discussion, montre_ton_projet]

    NouvellePublication:
      type: object
      required: [type, titre, contenu]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/TypePublication' }
        titre: { type: string, minLength: 10, maxLength: 150 }
        contenu: { type: string, minLength: 0, maxLength: 10000, description: 'Texte mis en forme (petit Markdown), 20 caractères au moins sans pièce jointe.' }
        projetId: { type: string, format: uuid, description: 'Obligatoire pour `montre_ton_projet`, interdit sinon.' }
        pieces: { $ref: './fichiers.yaml#/components/schemas/Pieces' }

    PublicationResume:
      type: object
      description: 'Dans un fil, une publication se lit en entier (v0.6), avec son texte.'
      required: [id, communaute, type, titre, auteur, nombreReponses, accepteeLe, creeLe, contenu, piecesJointes]
      properties:
        id: { type: string, format: uuid }
        communaute: { type: string, description: Slug de la communauté. }
        type: { $ref: '#/components/schemas/TypePublication' }
        titre: { type: string }
        auteur:
          oneOf: [{ $ref: './projets.yaml#/components/schemas/PersonneResume' }, { type: 'null' }]
          description: '`null` : compte supprimé, affiché « compte supprimé ».'
        nombreReponses: { type: integer, minimum: 0 }
        accepteeLe: { type: [string, 'null'], format: date-time, description: 'Pour une question : quand une réponse a été acceptée.' }
        creeLe: { type: string, format: date-time }
        contenu: { type: string, description: 'Texte brut, affiché échappé.' }
        piecesJointes: { type: array, maxItems: 6, items: { $ref: './fichiers.yaml#/components/schemas/PieceJointe' } }

    PagePublications:
      allOf:
        - $ref: './socle.yaml#/components/schemas/Page'
        - type: object
          properties:
            elements: { type: array, items: { $ref: '#/components/schemas/PublicationResume' } }

    Publication:
      allOf:
        - $ref: '#/components/schemas/PublicationResume'
        - type: object
          required: [contenu, projetId, reponseAccepteeId, reponses, moi]
          properties:
            contenu: { type: string }
            projetId: { type: [string, 'null'], format: uuid, description: 'Le projet montré (`montre_ton_projet`).' }
            reponseAccepteeId: { type: [string, 'null'], format: uuid }
            reponses:
              type: array
              description: La réponse acceptée d'abord, puis les autres, des plus anciennes aux plus récentes.
              items: { $ref: '#/components/schemas/Reponse' }
            moi:
              type: object
              description: Ma place, pour afficher les bons boutons. Les droits restent vérifiés par le serveur.
              required: [estAuteur, estMembre]
              properties:
                estAuteur: { type: boolean }
                estMembre: { type: boolean }

    NouvelleReponse:
      type: object
      required: [contenu]
      additionalProperties: false
      properties:
        contenu: { type: string, minLength: 10, maxLength: 10000, description: Texte brut. }

    Reponse:
      type: object
      required: [id, contenu, auteur, acceptee, creeLe]
      properties:
        id: { type: string, format: uuid }
        contenu: { type: string }
        auteur:
          oneOf: [{ $ref: './projets.yaml#/components/schemas/PersonneResume' }, { type: 'null' }]
          description: '`null` : compte supprimé.'
        acceptee: { type: boolean }
        creeLe: { type: string, format: date-time }

    NouvelleCommunaute:
      type: object
      required: [nom, description, theme]
      additionalProperties: false
      properties:
        nom: { type: string, minLength: 3, maxLength: 80 }
        description: { type: string, minLength: 10, maxLength: 500, description: Texte brut. }
        theme:
          type: string
          enum: [flutter, fintech, ia, web, cloud, design, data, jeux, securite, antenne, autre]
        pays:
          oneOf: [{ $ref: './profils.yaml#/components/schemas/Pays' }, { type: 'null' }]
          description: Pour une antenne locale.
        couvertureId:
          type: [string, 'null']
          format: uuid
          description: 'Une image envoyée avant par `POST /api/fichiers` (sans conversation ni cercle), par la même personne. Vide : le motif.'

    ChoixCouverture:
      type: object
      additionalProperties: false
      properties:
        fichierId:
          type: [string, 'null']
          format: uuid
          description: 'Une image envoyée par le modérateur (sans conversation ni cercle). Vide : la communauté revient à son motif.'

    AppelSalon:
      type: object
      description: |
        Un appel lancé dans un salon. « En cours » veut dire lancé il y a moins d'une heure et pas terminé : le service
        d'appel ne prévient pas Jamii quand les gens partent, on ne dit donc pas combien de personnes sont dedans.
      required: [id, lancePar, lanceLe, url]
      properties:
        id: { type: string, format: uuid }
        lancePar: { oneOf: [{ $ref: './projets.yaml#/components/schemas/PersonneResume' }, { type: 'null' }] }
        lanceLe: { type: string, format: date-time }
        url:
          type: [string, 'null']
          format: uri
          description: 'La salle de cet appel (une adresse neuve à chaque appel). `null` si je ne suis pas membre.'

    NouveauSalon:
      type: object
      required: [nom, sujet]
      additionalProperties: false
      properties:
        nom: { type: string, minLength: 2, maxLength: 40, description: 'Sans le « # ». Par exemple « offres-emploi ».' }
        sujet: { type: string, minLength: 5, maxLength: 200 }

    MembreCommunaute:
      type: object
      required: [personne, role, rejointLe, actif]
      properties:
        personne: { $ref: './projets.yaml#/components/schemas/PersonneResume' }
        role: { type: string, enum: [membre, moderateur] }
        rejointLe: { type: string, format: date-time }
        actif: { type: boolean, description: 'A écrit, publié ou répondu dans cette communauté ces 7 derniers jours.' }

    Salon:
      type: object
      required: [id, slug, nom, sujet, appel]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, examples: [general, entraide, projets] }
        nom: { type: string, maxLength: 60, description: 'Affiché « # » devant : « #entraide ».' }
        sujet: { type: string, maxLength: 200 }
        appel:
          oneOf: [{ $ref: '#/components/schemas/AppelSalon' }, { type: 'null' }]
          description: 'L''appel en cours dans le salon (v0.7), ou `null` s''il n''y en a pas.'

    MessageSalon:
      type: object
      required: [id, numero, auteur, texte, envoyeLe, appel, piecesJointes]
      properties:
        id: { type: string, format: uuid }
        numero: { type: integer, format: int64, description: 'Croissant : sert de curseur à `apres`.' }
        auteur: { $ref: './projets.yaml#/components/schemas/PersonneResume' }
        texte: { type: string, maxLength: 2000, description: 'Texte mis en forme (petit Markdown), affiché échappé.' }
        envoyeLe: { type: string, format: date-time }
        appel:
          type: ['object', 'null']
          description: 'Si le message annonce un appel lancé (v0.7) : cet appel, et s''il est encore en cours.'
          required: [id, enCours]
          properties:
            id: { type: string, format: uuid }
            enCours: { type: boolean }
        piecesJointes: { type: array, maxItems: 6, items: { $ref: './fichiers.yaml#/components/schemas/PieceJointe' } }

    NouveauMessageSalon:
      type: object
      required: [texte]
      additionalProperties: false
      properties:
        texte: { type: string, maxLength: 2000, description: 'Texte mis en forme (petit Markdown). Vide seulement avec des pièces jointes.' }
        pieces: { $ref: './fichiers.yaml#/components/schemas/Pieces' }

    NouveauSignalement:
      type: object
      required: [cibleType, cibleId, motif]
      additionalProperties: false
      properties:
        cibleType: { type: string, enum: [publication, reponse] }
        cibleId: { type: string, format: uuid }
        motif: { type: string, enum: [spam, irrespectueux, hors_sujet, autre] }
        precision: { type: string, maxLength: 500, description: 'Facultatif, texte brut.' }

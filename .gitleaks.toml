# Règles gitleaks par défaut, plus les exceptions documentées ci-dessous.
[extend]
useDefault = true

[allowlist]
description = "Valeurs de développement local, publiques et sans risque"
paths = ['''^\.env\.example$''', '''^docker-compose\.yml$''']
# Clé factice d'un test du webhook Systalink (#142), remplacée depuis par une valeur tirée au hasard à l'exécution.
# Elle reste dans l'historique de la branche : on la déclare ici plutôt que de réécrire l'historique.
regexes = ['''secret-partage-0123456789''']

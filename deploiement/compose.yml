# Jamii sur le serveur cloud Systalink (DataCloud, Madrid). Une seule entrée publique : Caddy (80/443, HTTPS).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: postgres.env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jamii -d jamii"]
      interval: 5s
      timeout: 3s
      retries: 20

  ia:
    image: ghcr.io/algabah2004/jamii-ia:main
    restart: unless-stopped
    env_file: ia.env
    depends_on: { postgres: { condition: service_healthy } }

  api:
    image: ghcr.io/algabah2004/jamii-api:main
    restart: unless-stopped
    env_file: api.env
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=35 -XX:+UseSerialGC
      # Les appels WebRTC (#157) : l'API signe des identifiants temporaires pour notre relais coturn (service turn).
      TURN_URLS: turn:${DOMAINE}:3478?transport=udp,turn:${DOMAINE}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET}
    depends_on: { postgres: { condition: service_healthy } }

  web:
    image: ghcr.io/algabah2004/jamii-web:main
    restart: unless-stopped
    environment:
      PORT: "8080"
      API_URL: http://api:8080
    depends_on: [api]

  entree:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAINE: ${DOMAINE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

  # Le relais TURN des appels (#157, deploiement/turnserver.conf). Sur le réseau de l'hôte : publier 200 ports UDP par
  # Docker serait lent, et coturn doit voir les vraies adresses. Pare-feu : 3478 (UDP et TCP), 49160-49359 (UDP).
  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAINE}
      - --external-ip=${IP_PUBLIQUE}

volumes:
  pgdata:
  caddy_data:

# Le relais TURN des appels Jamii (#157) : coturn (licence BSD), à côté de l'API sur le serveur Systalink.
# Il ne sert que quand deux navigateurs ne peuvent pas se joindre directement (NAT strict, réseau d'entreprise, 4G).
#
# Ni secret ni adresse ici : le secret partagé avec l'API (TURN_SECRET), l'adresse publique et le domaine arrivent par
# la ligne de commande (compose.yml), depuis le fichier .env du serveur, jamais dans le dépôt.

listening-port=3478
# Pas de TURN sur TLS pour l'instant : le port 443 est déjà pris par Caddy (voir deploiement/README.md).
no-tls
no-dtls

# Identifiants temporaires signés par l'API (« TURN REST API ») : <expiration>:<utilisateur> et HMAC-SHA1 du secret.
# Personne sans session Jamii ne peut utiliser le relais, et un identifiant expire au bout de 4 heures.
use-auth-secret
fingerprint
stale-nonce=600

# Une petite plage de ports de relais : un appel relayé en prend 2 à 4. 200 ports, c'est une cinquantaine d'appels
# relayés en même temps, bien assez pour un serveur à 1 cœur. À ouvrir dans le pare-feu (UDP).
min-port=49160
max-port=49359

# Des limites, pour qu'un compte ne transforme pas le relais en tuyau gratuit.
user-quota=8
total-quota=120
max-bps=1500000

# Le relais ne doit jamais servir à atteindre le réseau privé du serveur (Postgres, l'API, la passerelle du cloud).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
no-software-attribute
log-file=stdout
simple-log

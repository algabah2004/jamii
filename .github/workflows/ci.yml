name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Aucun secret dans le code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: Hygiène du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Aucun fichier .env commité
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::Un fichier .env est commité. Retire-le et mets ses variables dans .env.example"; exit 1
          fi
      - name: Aucun fichier de plus de 5 Mo
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +5M 2>/dev/null)
          if [ -n "$big" ]; then echo "::error::Fichiers trop lourds : $big"; exit 1; fi
      - name: docker-compose valide
        run: cp .env.example .env && docker compose config -q

  pr-title:
    name: Titre de PR conventionnel
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
          requireScope: false

  ia:
    name: Service IA (lint et tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ia
    # Les tests tournent sur un vrai PostgreSQL (même version que docker-compose.yml).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jamii
          POSTGRES_USER: jamii
          POSTGRES_PASSWORD: jamii_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jamii -d jamii"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://jamii:jamii_ci_only@localhost:5432/jamii
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/ia/uv.lock
      # --locked : échoue si uv.lock ne correspond plus à pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # Les jobs build et tests de web et api seront ajoutés ici
  # quand leur stack sera validée (#6).

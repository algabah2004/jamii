name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Aucun secret dans le code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: Hygiène du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Aucun fichier .env commité
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::Un fichier .env est commité. Retire-le et mets ses variables dans .env.example"; exit 1
          fi
      - name: Aucun fichier de plus de 5 Mo
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +5M 2>/dev/null)
          if [ -n "$big" ]; then echo "::error::Fichiers trop lourds : $big"; exit 1; fi
      - name: docker-compose valide
        run: cp .env.example .env && docker compose config -q

  pr-title:
    name: Titre de PR conventionnel
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
          requireScope: false

  api:
    name: API (build et tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      # Les tests d'intégration démarrent PostgreSQL avec Testcontainers (Docker est fourni par le runner).
      - run: ./mvnw -B verify

  # Les jobs build et tests de web et ia seront ajoutés ici
  # quand leur stack sera validée (#6).
